[package]
name = "byline-desktop"
version = "0.1.0"
description = "Byline in its own window"
edition = "2021"
publish = false
license = "Apache-2.0"

[[bin]]
name = "byline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
opt-level = "s"
strip = true
