<title>Byline — your people, your correspondents, your story</title>
<style>
:root{
  --bg:#0d0d0e; --panel:#141416; --tile:#1a1a1d; --tile2:#212125; --border:#2c2c31;
  --text:#f3efe4; --muted:#9c988c; --dim:#8b867b;   /* ≥4.5:1 on --panel and --bg; axe flagged the old #6d695f in twenty places */
  --honey:#e8412f; --honey2:#b8342a; --amber-soft:rgba(232,65,47,.13);
  --agent:#7fa8d4; --agent-soft:rgba(127,168,212,.14);
  --good:#5aa877; --hot:#ff7a63; --info:#7fa8d4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --r:8px; --shadow:0 14px 40px rgba(0,0,0,.55);
  --rail:66px; --side:262px;
  /* surfaces that used to be literals scattered through the sheet */
  --deep:var(--deep); --deep2:#0d0f14; --ink:#08090c; --ink2:#0a0a0b; --well:#12141a; --well2:#101219; --well3:#12141b; --well4:#0b0c10;
  --edge:#2b3140; --edge2:#33333a; --edge3:#3d465c; --edge4:#39415a; --edge5:#1c202b; --ghost:#7c8598;
  --amber-bg:#231a05; --amber-bg2:#1a1508; --on-accent:#fff;
  --accent-bg:#c93020;   /* white on this is 5.3:1; white on --honey itself is 4.0:1, which a test refused */
  color-scheme:dark;
}
/* A light room. Same tokens, different values — nothing else in the sheet
   knows which one it is. Dark is the default the app was drawn in; the
   setting is yours, and "system" follows the machine. */
:root[data-theme="light"]{
  --bg:#f5f2ea; --panel:#fffdf8; --tile:#f0ece2; --tile2:#e7e2d6; --border:#d3cdbf;
  --text:#1b1a17; --muted:#5b574d; --dim:#645f55;
  --honey:#b8342a; --honey2:#8f2820; --amber-soft:rgba(184,52,42,.10);
  --agent:#2f5f92; --agent-soft:rgba(47,95,146,.12);
  --good:#2f7a4f; --hot:#b5361f; --info:#2f5f92;
  --shadow:0 14px 40px rgba(40,30,10,.18);
  --deep:#faf8f2; --deep2:#f7f4ec; --ink:#fffdf8; --ink2:#f3efe6; --well:#f3efe6; --well2:#f5f2ea; --well3:#f3efe6; --well4:#fbf9f3;
  --edge:#d3cdbf; --edge2:#cfc8ba; --edge3:#c4bdae; --edge4:#c9c2b3; --edge5:#ddd7ca; --ghost:#6b665b;
  --amber-bg:#fbefd8; --amber-bg2:#fdf3e0; --on-accent:#fff;
  --accent-bg:#b8342a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);overflow:hidden;
  font:14.5px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3,h4{margin:0;font-weight:650}
h1,h2{font-family:var(--serif);letter-spacing:-.2px}
a{color:var(--info)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
/* avatars are cut squares — a stamp, not a honeycomb */
.hex{clip-path:none;border-radius:4px}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}

#app{display:flex;height:100vh;overflow:hidden}
.rail{width:var(--rail);flex:none;background:var(--ink);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px;z-index:30}
.rail .ws{width:42px;height:44px;display:grid;place-items:center;font-weight:700;font-size:22px;
  font-family:var(--serif);background:linear-gradient(150deg,var(--honey),var(--honey2));color:var(--on-accent);transition:.15s}
.rail .ws:hover{filter:brightness(1.1)}
.rail .ws.ghost{background:var(--tile);color:var(--muted);font-size:20px;font-weight:400}
.rail .sp{flex:1}
.rail .ricon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);font-size:16px;transition:.15s;position:relative}
.rail .ricon:hover{background:var(--tile);color:var(--text)}
.rail .ricon.on{background:var(--amber-soft);color:var(--honey)}

.sidebar{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;z-index:20}
.wsHead{padding:12px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.wsHead h2{font-size:15px}
.wsHead .sub{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 8px var(--good)}
.sideScroll{flex:1;overflow-y:auto;padding:8px 8px 24px}
.livebar{display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--border);background:rgba(90,168,119,.06)}
.sgroup{margin-top:12px}
.sgroup .shead{display:flex;align-items:center;gap:6px;padding:5px 8px;color:var(--dim);
  font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.sgroup .shead .sp{flex:1}
.sgroup .shead button{color:var(--dim);font-size:16px;line-height:1;padding:0 4px;border-radius:6px}
.sgroup .shead button:hover{color:var(--honey);background:var(--tile)}
.chan{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;color:var(--muted);
  font-size:14px;cursor:pointer;position:relative;transition:.12s;user-select:none}
.chan:hover{background:var(--tile);color:var(--text)}
.chan.on{background:var(--amber-soft);color:var(--honey);font-weight:600}
.chan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan .lock{font-size:11px;opacity:.75;width:12px;text-align:center}
.badge{background:var(--hot);color:var(--on-accent);font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.av{width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:12px;color:var(--well);font-weight:700}
.av.big{width:34px;height:34px;font-size:16px}
.av.xl{width:54px;height:54px;font-size:25px}
.av.sm{width:18px;height:18px;font-size:10px}
.workdot{width:7px;height:7px;border-radius:50%;background:var(--agent);animation:pulse 1s infinite;flex:none}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:54px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:12px;padding:0 14px;background:linear-gradient(180deg,var(--well2),var(--deep2))}
.topbar h3{font-size:15.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.topbar .topic{color:var(--dim);font-size:12.5px;border-left:1px solid var(--border);padding-left:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw}
.topbar .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--tile);padding:3px;border-radius:10px}
.tabs button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--tile2);color:var(--honey)}
.facepile{display:flex;align-items:center;cursor:pointer}
.facepile .av{margin-left:-6px;outline:2px solid var(--deep2)}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.iconbtn:hover{background:var(--tile);color:var(--text)}
.iconbtn.on{background:var(--amber-soft);color:var(--honey)}

.body{flex:1;display:flex;min-height:0;min-width:0}
.stream{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:16px 20px 8px}
.pane{flex:1;overflow-y:auto;padding:20px 22px 40px}

.msg{display:flex;gap:11px;padding:6px 8px;border-radius:10px;position:relative;margin:1px 0}
.msg:hover{background:var(--well3)}
.msg:hover .mtools,.msg:focus-within .mtools{opacity:1;pointer-events:auto}
.msg .gutter{width:34px;flex:none;display:flex;justify-content:center;padding-top:3px}
.msg .gutter .ts{font-size:10px;color:var(--dim);opacity:0;padding-top:4px}
.msg:hover .gutter .ts{opacity:1}
.mbody{flex:1;min-width:0}
.mhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:1px}
.mhead .who{font-weight:700;font-size:14px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:1.5px 5px;border-radius:5px;
  background:var(--agent-soft);color:var(--agent);text-transform:uppercase}
.tag.wf{background:#3ddc971f;color:var(--good)}
.mhead .when{font-size:11px;color:var(--dim)}
.sig{font-size:10px;color:var(--dim);display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  border:1px solid var(--border);border-radius:20px;padding:0 6px;height:16px;transition:.14s}
.sig:hover{border-color:var(--good);color:var(--good)}
/* a grouped line used to carry no byline at all; it is there now, quietly, and always on request */
.sigline{display:flex;justify-content:flex-end;margin-top:2px;opacity:0;transition:opacity .14s}
.msg.cont:hover .sigline,.msg.cont:focus-within .sigline,body.allbylines .sigline{opacity:1}
.sig.bad{border-color:var(--hot);color:var(--hot)}
.mtext{white-space:pre-wrap;word-wrap:break-word;font-size:15.2px;font-family:var(--serif);line-height:1.6}
.mtext code{background:var(--deep);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12.5px}
.mtext .mention{background:var(--amber-soft);color:var(--honey);border-radius:5px;padding:0 4px;font-weight:600}
.mtext .mention.agent{background:var(--agent-soft);color:var(--agent)}
.mtext pre{background:var(--deep);border:1px solid var(--border);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:12.5px;margin:6px 0}
.mtext blockquote{border-left:3px solid var(--border);margin:4px 0;padding:2px 0 2px 10px;color:var(--muted)}
.mtools{position:absolute;top:-12px;right:10px;display:flex;gap:2px;background:var(--tile2);
  border:1px solid var(--border);border-radius:9px;padding:2px;opacity:0;pointer-events:none;box-shadow:var(--shadow)}
.mtools button{width:26px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.mtools button:hover{background:var(--edge);color:var(--text)}
.rxns{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.rxn{display:inline-flex;align-items:center;gap:5px;background:var(--tile);border:1px solid var(--border);
  border-radius:20px;padding:1px 8px;font-size:12px;transition:.12s}
.rxn:hover{border-color:var(--edge3)}
.rxn.mine{background:var(--amber-soft);border-color:#ffc24755;color:var(--honey)}
.rxn .n{font-size:11px;font-weight:700}
.threadlink{margin-top:5px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--info);
  font-weight:600;padding:3px 8px;border-radius:8px}
.threadlink:hover{background:#5aa9ff14}
.sysmsg{display:flex;gap:9px;align-items:center;padding:5px 12px;color:var(--dim);font-size:12.5px}
.receipt{border:1px solid #3ddc9733;background:#3ddc970a;border-radius:10px;padding:8px 11px;margin:2px 0}
.daysep{display:flex;align-items:center;gap:12px;margin:16px 4px 10px;color:var(--dim);font-size:11.5px;font-weight:700}
.daysep:before,.daysep:after{content:"";flex:1;height:1px;background:var(--border)}

/* search */
mark{background:rgba(232,65,47,.28);color:inherit;border-radius:3px;padding:0 2px}
.searchbox{padding:8px 10px;border-bottom:1px solid var(--border);flex:none}
.searchbox input{width:100%;background:var(--ink2);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px 7px 28px;font-size:13px;outline:0;transition:.14s}
.searchbox input:focus{border-color:rgba(232,65,47,.5);box-shadow:0 0 0 3px rgba(232,65,47,.07)}
.searchbox{position:relative}
.searchbox:before{content:"⌕";position:absolute;left:19px;top:14px;color:var(--dim);font-size:15px;pointer-events:none}
.sres{padding:10px 12px;border:1px solid var(--border);background:var(--tile);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.14s}
.sres:hover{border-color:rgba(232,65,47,.45);background:var(--tile2)}
.sres .snip{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:3px}
@keyframes flashme{0%{background:rgba(232,65,47,.22)}100%{background:transparent}}
.flashme{animation:flashme 1.8s ease-out}
/* attachments */
.att{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:flex-start}
.attimg{max-width:280px;max-height:220px;border-radius:8px;border:1px solid var(--border);cursor:pointer;display:block}
.attfile{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--tile2);
  border-radius:9px;padding:8px 12px;text-decoration:none;color:var(--text);font-size:13px;transition:.14s}
.attfile:hover{border-color:rgba(232,65,47,.45)}
.attfile .ic{font-size:19px}
.attchip{display:inline-flex;align-items:center;gap:7px;background:var(--tile2);border:1px solid var(--border);
  border-radius:8px;padding:4px 8px;font-size:12px;margin:0 6px 6px 0}
.attchip button{color:var(--dim);font-size:13px;line-height:1}
.attchip button:hover{color:var(--hot)}
.dropzone{position:absolute;inset:0;background:rgba(232,65,47,.09);border:2px dashed var(--honey);
  border-radius:12px;display:grid;place-items:center;z-index:60;font-weight:700;pointer-events:none;font-size:15px}
.propbar{border:1px solid var(--agent);background:rgba(127,168,212,.06);border-radius:11px;padding:8px 10px;margin-bottom:12px}
.prop{background:var(--tile);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.prop + .prop{margin-top:7px}
.pinbar{border:1px solid #ffc24733;background:#ffc2470a;border-radius:11px;padding:6px 8px;margin-bottom:12px}
.pinrow{display:flex;align-items:center;gap:8px;padding:3px 4px}
.pinrow .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.thinking{display:flex;gap:11px;padding:6px 8px}
.thinkcard{border:1px solid var(--agent);background:#a06cff0a;border-radius:11px;padding:8px 11px;flex:1;min-width:0}
.thinkcard .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--agent);font-weight:700}
.acts{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.act{font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:center;animation:fade .3s}
.act .tool{color:var(--honey);font-family:ui-monospace,Consolas,monospace;font-size:11px}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
.blink{width:6px;height:6px;border-radius:50%;background:var(--agent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.composerWrap{padding:6px 20px 16px;flex:none}
.composer{border:1px solid var(--border);background:var(--tile);border-radius:14px;transition:.15s}
.composer:focus-within{border-color:#ffc24766;box-shadow:0 0 0 3px #ffc2470f}
.composer textarea{width:100%;background:none;border:0;outline:0;resize:none;padding:11px 13px 4px;
  max-height:190px;min-height:44px;font-size:14.5px;line-height:1.5}
.crow{display:flex;align-items:center;gap:3px;padding:4px 8px 7px}
.crow .sp{flex:1}
.crow .hint{font-size:11px;color:var(--dim);padding-right:6px}
.send{background:linear-gradient(135deg,var(--honey),var(--honey2));color:var(--amber-bg);font-weight:800;
  border-radius:9px;padding:6px 13px;font-size:13px;box-shadow:0 4px 14px #ffc24730}
.send:disabled{opacity:.4;box-shadow:none;cursor:default}
.mentionPop{position:absolute;bottom:100%;left:14px;margin-bottom:8px;background:var(--tile2);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:300px;overflow:hidden;z-index:50}
.mentionPop .it{display:flex;align-items:center;gap:9px;padding:7px 10px;font-size:13.5px;cursor:pointer}
.mentionPop .it.on{background:var(--amber-soft)}
.mentionPop .it .d{color:var(--dim);font-size:11.5px}

.rpanel{width:380px;flex:none;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rpanel .rhead{height:47px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:700}
.rpanel .rbody{flex:1;overflow-y:auto;padding:10px 12px 20px}

.btn{background:var(--tile);border:1px solid var(--border);border-radius:9px;padding:7px 12px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.14s}
.btn:hover{background:var(--tile2);border-color:var(--edge4)}
.btn.primary{background:linear-gradient(135deg,var(--honey),var(--honey2));color:var(--amber-bg);border-color:transparent;box-shadow:0 5px 16px #ffc24728}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.danger{color:var(--hot);border-color:#ff5d7333}
.btn.danger:hover{background:#ff5d7314}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--tile);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.card h4{font-size:14px;margin-bottom:3px}
.mut{color:var(--muted)} .dimt{color:var(--dim)} .tiny{font-size:11.5px}
.sec{max-width:940px;margin:0 auto}
.grid{display:grid;gap:12px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:13px 0 5px;letter-spacing:.3px}
input.i,select.i,textarea.i{width:100%;background:var(--deep);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;outline:0;font-size:13.5px;transition:.14s}
input.i:focus,select.i:focus,textarea.i:focus{border-color:#ffc24766;box-shadow:0 0 0 3px #ffc2470d}
textarea.i{resize:vertical;min-height:90px;line-height:1.5}
.sw{width:42px;height:23px;border-radius:20px;background:var(--edge);position:relative;transition:.18s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ghost);transition:.18s}
.sw.on{background:#ffc24740}
.sw.on:after{left:22px;background:var(--accent-bg)}
.rowbox{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);
  background:var(--tile);border-radius:11px;margin-bottom:8px}
.rowbox .sp{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;

/* ==========================================================================
   EVENTS
   ========================================================================== */
/* The record is an append-only chain: each entry carries the hash of the one
   before it, so altering an entry breaks every link after it — and removing or
   reordering one breaks the chain too. Signing entries individually catches
   edits but not deletions, which is the failure a record has to survive. */
/* The chain covers a *hash* of the payload, not the payload itself. That is what
   makes an entry redactable: clear the content for an erasure request and the
   hash — and therefore every link after it — still verifies. */
const dataHashOf = d => digest('data:' + JSON.stringify(d == null ? {} : d), 24);
const chainOf = e => digest('chain:' + (e.prev || 'genesis') + '|' + e.kind + '|' +
  (e.dataHash || dataHashOf(e.data)) + '|' + e.ts + '|' + e.actorId, 24);

function logEvent(kind, data, actorId) {
  const a = actorId || S.meId;
  const ev = { id: uid('ev'), kind, data: data || {}, ts: now(), actorId: a };
  ev.dataHash = dataHashOf(ev.data);          // the chain covers this, so the payload stays redactable
  ev.prev = S.events.length ? S.events[0].chain || 'genesis' : 'genesis';
  ev.chain = chainOf(ev);
  ev.sig = digest('sig:' + ((S.people[a] || {}).sec || 'sys') + ':' + kind + JSON.stringify(ev.data) + ev.ts, 24);
  S.events.unshift(ev);
  /* Keep the newest 400 — but never trim past an anchored head. An anchor is
     a promise that the record can be checked against it later; trimming the
     entry it points at turned every anchor older than 400 events into a
     false report of tampering. Bounded, so a forgotten anchor cannot make
     the record grow without limit. */
  let keep = 400;
  (S.anchors || []).forEach(a => { const i = S.events.findIndex(e => e.chain === a.head); if (i >= 0) keep = Math.max(keep, i + (a.count || 1)); });
  keep = Math.min(keep, 1200);
  if (S.events.length > keep) S.events.length = keep;
  sealEvent(ev);            // a hash alone is forgeable — the link gets signed too
  return ev;
}

/* A hash chain on its own proves nothing against someone who can edit the
   store: they delete an entry and recompute every link, because the hash takes
   no secret. Sealing each link with the actor's private key means repairing the
   chain requires that key. Async, so the entry is usable immediately. */
async function sealEvent(ev) {
  const a = S.people[ev.actorId];
  if (!a || !hasPriv(a) || !SUBTLE) return;
  try { ev.seal = await signReal({ id: ev.chain, channelId: '', authorId: ev.actorId, text: ev.chain, kind: 'seal', ts: ev.ts }, a); }
  catch (e) { /* unsealed entries are reported by the verifier, not hidden */ }
}
async function verifySeal(ev) {
  const a = S.people[ev.actorId];
  if (!ev.seal || !a || !a.pubJwk || !SUBTLE) return null;
  try {
    return await SUBTLE.verify(ECSIG, await _pub(a), unHex(ev.seal),
      encU(signBody({ id: ev.chain, channelId: '', authorId: ev.actorId, text: ev.chain, kind: 'seal', ts: ev.ts })));
  } catch (e) { return false; }
}
/* Verify every seal. This is what makes an exported record checkable by
   somebody who holds only the public keys. */
async function verifyRecordSeals() {
  const out = { sealed: 0, unsealed: 0, broken: [] };
  for (const ev of S.events) {
    if (!ev.chain) continue;
    const r = await verifySeal(ev);
    if (r === null) out.unsealed++;
    else if (r) out.sealed++;
    else { out.broken.push(ev.kind); }
  }
  return out;
}

/* Walk oldest → newest. The oldest entry present is the anchor (the tail gets
   trimmed at 400), so we verify continuity from there rather than demanding
   genesis. Entries written before the chain existed are reported, not failed. */
function verifyRecord(events) {
  const list = events || S.events;
  const chrono = list.slice().reverse().filter(e => e.chain);
  const legacy = list.length - chrono.length;
  if (!chrono.length) return { ok: true, checked: 0, legacy, note: 'nothing chained yet' };
  let prev = chrono[0].prev;
  for (let i = 0; i < chrono.length; i++) {
    const e = chrono[i];
    if (e.prev !== prev) return { ok: false, at: i, of: chrono.length, why: 'an entry is missing or out of order', kind: e.kind, legacy };
    /* the chain covers the payload's hash, so the hash must still match the
       payload — otherwise the contents could be rewritten under a stale hash.
       A redacted entry is the one exception: its payload is cleared on purpose. */
    if (!e.redacted && e.dataHash && e.dataHash !== dataHashOf(e.data))
      return { ok: false, at: i, of: chrono.length, why: 'an entry\'s contents no longer match its hash', kind: e.kind, legacy };
    if (chainOf(e) !== e.chain) return { ok: false, at: i, of: chrono.length, why: 'an entry was altered after it was filed', kind: e.kind, legacy };
    prev = e.chain;
  }
  return { ok: true, checked: chrono.length, legacy };
}

async function scanHarnesses() {
  const host = $('#onb');
  const ids = Object.keys(HARNESSES);
  for (const id of ids) {
    await sleep(520);
    const row = host.querySelector(`[data-h="${CSS.escape(id)}"]`); if (!row) return;
    OB.installed[id] = true;
    row.classList.add('found');
    row.querySelector('.stat').innerHTML = `<span class="pill good">✓ detected</span>`;
  }
  const b = host.querySelector('#obNext');
  if (b) { b.disabled = false; b.textContent = 'Install all & continue'; b.onclick = async () => { b.textContent = 'Installing…'; await sleep(600); OB.step = 3; paintOnb(); }; }
}

async function finishOnboarding() {
  const spin = $('#spin');
  const line = (txt, done) => {
    const d = el('div', 'hbox', `${done ? '<span style="color:var(--good)">✓</span>' : '<div class="scan"></div>'}<div style="flex:1">${txt}</div>`);
    if (spin) spin.appendChild(d); return d;
  };
  await sleep(700);
  if (spin) spin.innerHTML = '';
  line('Cut byline keys for Splash, Scout and Nib', true);
  await sleep(500); line(`Put them on <b>${esc(HARNESSES[OB.harness].name)}</b>`, true);
  await sleep(500); line('Opened #newsroom, #general, #engineering, 🔒social-media', true);
  await sleep(600);

  const built = await seed({ name: OB.name, avatar: OB.avatar, sec: OB.sec, pub: OB.pub, ident: OB.ident, harness: OB.harness, community: OB.community, selfHosted: OB.selfHosted, relay: OB.relay, installed: OB.installed });
  OWNER = S.meId;
  obDone();
  render();
  initSync();          // a window that just created the masthead still joins the live channel
  runWelcomeSequence(built);
  if (!TESTING) setTimeout(() => offerLock(lockAdvice(location.protocol)), 9000);   // after the welcome, not over it
}

/* the starter team says hello, and delegates introductions into a thread */
async function runWelcomeSequence(b) {
  const { welcome, fizz, bumble, honey } = b;
  await sleep(700);
  const hi = postMessage({
    channelId: welcome.id, authorId: fizz.id,
    text: `Hi ${me().name} — I'm **Splash**, your editor. Welcome to Byline. 📰\n\nThis is the main desk. I don't write the story: I decide who does, and I come back when it's filed.\n\nThree things worth knowing:\n\n1. Correspondents only move when you **@mention** them — no noise otherwise.\n2. Every line filed here carries a **byline**, signed by whoever wrote it. Click the ✒ on any message.\n3. Put a correspondent on a desk at any point and it reads the whole run before it says a word.\n\nI've asked @scout and @nib to introduce themselves in a thread, so the desk stays readable.`
  });
  paintMessages();
  await sleep(900);
  react2(hi, '👀', fizz.id);
  await sleep(400);
  await agentReply(bumble, welcome, hi.id, `**Scout** — research. 🔍\n\nPrimary sources, cited. If I can't source a claim I mark it *unsourced* rather than dress it up. Findings go on the desk galley so nobody has to brief the next correspondent from scratch.\n\nPoint me at a question, not a task.`);
  await sleep(500);
  await agentReply(honey, welcome, hi.id, `**Nib** — copy. 🖋️\n\nI draft from Scout's outlines, and I'll argue with you about the shape of a piece before you commit to it.\n\nBritish English, short lines, no preamble.`);
  toast('Try: @splash get me a brief on something', true);
}

function react2(m, emoji, byId) {
  m.reactions = m.reactions || {}; m.reactions[emoji] = m.reactions[emoji] || [];
  if (!m.reactions[emoji].includes(byId)) m.reactions[emoji].push(byId);
  save(); paintMessages();
}
async function agentReply(agent, c, threadOf, text) {
  const m = postMessage({ channelId: c.id, authorId: agent.id, text, threadOf });
  save(); paintMessages(); if (UI.rpanel === 'thread') renderRPanel();
  return m;
}

/* ---------- search ----------
   Plain terms match the copy; from:<handle> filters by who filed it;
   in:<desk> narrows to one desk; has:file finds attachments. */
function runSearch(q) {
  const raw = q.trim(); if (!raw) return [];
  let from = null, inDesk = null, needFile = false;
  const terms = raw.split(/\s+/).filter(t => {
    let m;
    if ((m = t.match(/^from:(.+)$/i))) { from = m[1].toLowerCase().replace(/^@/, ''); return false; }
    if ((m = t.match(/^in:(.+)$/i))) { inDesk = m[1].toLowerCase().replace(/^#/, ''); return false; }
    if (/^has:file$/i.test(t)) { needFile = true; return false; }
    return true;
  }).map(t => t.toLowerCase());

  const out = [];
  S.channels.forEach(c => {
    if (inDesk && !chanName(c).toLowerCase().includes(inDesk)) return;
    (S.messages[c.id] || []).forEach(m => {
      const a = S.people[m.authorId]; if (!a) return;
      if (from && !(a.handle.includes(from) || a.name.toLowerCase().includes(from))) return;
      if (needFile && !(m.att && m.att.length)) return;
      const hay = (m.text || '').toLowerCase();
      if (terms.length && !terms.every(t => hay.includes(t))) return;
      out.push({ m, c, a });
    });
  });
  /* The newest 120 are shown. Say so when there were more — a person who
     sees 120 results and no note has no way to know 80 are missing. */
  const sorted = out.sort((x, y) => y.m.ts - x.m.ts);
  const res = sorted.slice(0, 120);
  res.total = sorted.length;
  return res;
}
function hl(text, q) {
  const terms = q.split(/\s+/).filter(t => t && !/^(from|in|has):/i.test(t));
  let s = esc(text);
  terms.forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  });
  return s;
}
function snippet(text, q) {
  const terms = q.split(/\s+/).filter(t => t && !/^(from|in|has):/i.test(t));
  const i = terms.length ? text.toLowerCase().indexOf(terms[0].toLowerCase()) : 0;
  const start = Math.max(0, i - 70);
  return (start ? '…' : '') + text.slice(start, start + 220).replace(/\n+/g, ' ') + (text.length > start + 220 ? '…' : '');
}
function renderSearch(host) {
  const q = UI.query.trim();
  const res = runSearch(q);
  host.innerHTML = `<div class="pane"><div class="sec">
    <h2 style="font-size:20px">${res.total > res.length ? 'the newest ' + res.length + ' of ' + res.total.toLocaleString() + ' results' : res.length + (res.length === 1 ? ' result' : ' results')}</h2>
    <div class="mut tiny" style="margin-bottom:14px">Filters: <span class="mono">from:nib</span> · <span class="mono">in:newsroom</span> · <span class="mono">has:file</span></div>
    ${res.length ? res.map(({ m, c, a }) => `<div class="sres" data-go="${esc(m.id)}|${esc(c.id)}|${esc(m.threadOf || '')}">

      </div>
      <div class="snip">${hl(snippet(m.text || '', q), q)}</div></div>`).join('')
      : `<div class="empty"><div class="big">⌕</div>Nothing filed matches “${esc(q)}”.</div>`}
  </div></div>`;
  host.querySelectorAll('[data-go]').forEach(n => n.onclick = () => {
    const [mid, cid, tid] = n.dataset.go.split('|');

function flashMsg(id) {
  const n = document.querySelector(`[data-msg="${CSS.escape(id)}"]`);
  if (!n) return;
  n.scrollIntoView({ block: 'center', behavior: 'smooth' });
  n.classList.add('flashme');
  setTimeout(() => n.classList.remove('flashme'), 2000);

/* The desk sits in a role="log" region, and every repaint replaced its whole
   contents with innerHTML. To a screen reader that is not "one line arrived",
   it is "every line on this desk arrived" — the entire run read out again on
   a reaction, a settings change, anything. The region no longer announces
   itself; a line that is genuinely new is announced once, in a sentence. */
let LAST_SPOKEN = null;
function announceNewLine() {
  const c = chan(); if (!c) return;
  const list = msgs(c.id).filter(m => !m.threadOf);
  const last = list[list.length - 1];
  if (!last) return;
  if (LAST_SPOKEN === null) { LAST_SPOKEN = last.id; return; }   // the first paint is not news
  if (last.id === LAST_SPOKEN) return;
  LAST_SPOKEN = last.id;
  if (last.authorId === S.meId) return;                          // you know what you just filed
  const who = (S.people[last.authorId] || {}).name || 'someone';
  const words = String(last.text || '').replace(/\s+/g, ' ').trim().slice(0, 120);
  const live = $('#live');
  if (live) live.textContent = who + ' filed on ' + c.name + ': ' + words;
}
function paintMessages() {
  document.body.classList.toggle('allbylines', !!(S && S.settings && S.settings.allBylines));
  const host = $('#msgs'); if (!host) return;
  const c = chan(); if (!c) return;
  const all = msgs(c.id).filter(m => !m.threadOf);
  // only paint the tail — a long desk otherwise repaints thousands of nodes
  const hidden = Math.max(0, all.length - winFor(c.id));
  const list = hidden ? all.slice(hidden) : all;
  const atBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 140;
  let html = hidden ? `<div style="text-align:center;padding:4px 0 10px">
    <button class="btn sm" id="showEarlier">⌃ Show earlier copy <span class="dimt">· ${hidden} older</span></button></div>` : '';
  const held = (S.proposals || []).filter(p => p.channelId === c.id);
  if (held.length) {
    html += `<div class="propbar">
      <div class="tiny" style="letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--agent);padding:2px 4px 6px">
        Waiting on you — ${held.length} proposal${held.length === 1 ? '' : 's'}${held.length > 20 ? ' · showing the first 20' : ''}</div>
      ${held.slice(0, 20).map(p => { const a = S.people[p.authorId] || {};
      return `<div class="prop">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
          ${avatar(a, 'sm')}<b class="tiny">${esc(a.name)}</b>
          <span class="tag">asks first</span><span class="tiny dimt">${ago(p.ts)}</span></div>
        <div class="mtext" style="font-size:14px">${fmtText(p.text)}</div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn sm primary" data-rel="${esc(p.id)}">Release under its byline</button>
          <button class="btn sm ghost" data-spike="${esc(p.id)}">Spike</button>
        </div></div>`; }).join('')}
    </div>`;
  }
  const pins = (c.pinned || []).map(id => msgs(c.id).find(m => m.id === id)).filter(Boolean);
  if (pins.length) {
    html += `<div class="pinbar"><div class="tiny dimt" style="padding:2px 4px 4px;font-weight:700;letter-spacing:.7px;text-transform:uppercase">Front page</div>${pins.map(m => {
      const a = S.people[m.authorId];
      return `<div class="pinrow"><span>📌</span>${avatar(a, 'sm')}
        <div class="sp tiny"><b>${esc(a ? a.name : '?')}</b> — ${esc(m.text.replace(/[*#>`]/g, '').split('\n').filter(Boolean)[0] || '').slice(0, 120)}</div>
        <button class="btn sm ghost" data-unpin="${esc(m.id)}" title="Unpin">✕</button></div>`;
    }).join('')}</div>`;
  }
  if (!list.length) {
    const other = c.kind === 'dm' ? S.people[c.members.find(x => x !== S.meId)] : null;
    html += `<div class="empty"><div class="big">${other ? '' : chanIcon(c)}</div>
      <h3 style="color:var(--text);font-size:19px">${other ? 'Your private line to ' + esc(other.name) : 'This is the start of ' + chanIcon(c) + esc(c.name)}</h3>
      <div style="margin-top:6px;max-width:430px;margin-inline:auto">${other && other.type === 'agent'
        ? 'No mention needed on a private line — just ask.'
        : 'Put a correspondent on this desk, @mention it, and it files with the whole run already read.'}</div>
      ${other ? '' : `<div style="margin-top:14px"><button class="btn primary" id="staffDesk">Staff this desk</button></div>`}</div>`;
  }
  let lastDay = '', lastAuthor = '', lastTs = 0;
  list.forEach(m => {
    const day = fmtDay(m.ts);
    if (day !== lastDay) { html += `<div class="daysep">${day}</div>`; lastDay = day; lastAuthor = ''; }
    const cont = m.authorId === lastAuthor && (m.ts - lastTs) < 6e5 && m.kind === 'msg';
    html += msgHTML(m, cont);
    lastAuthor = m.kind === 'msg' ? m.authorId : ''; lastTs = m.ts;
  });
  host.innerHTML = html;
  announceNewLine();
  wireMessages(host);
  const se = host.querySelector('#showEarlier');
  if (se) se.onclick = () => {
    const before = host.scrollHeight;
    UI.win[c.id] = winFor(c.id) + 150;
    paintMessages();
    host.scrollTop += host.scrollHeight - before;   // keep the reader where they were
  };
  syncThinking();
  if (UI.jumpTo) { const id = UI.jumpTo; UI.jumpTo = null; setTimeout(() => flashMsg(id), 40); }
  else if (atBottom) host.scrollTop = host.scrollHeight;
}

/* Update only the live activity cards. Called on every agent tool-step, so it
   must never touch the message list — that repaint is what used to cost 250ms. */
function syncThinking() {
  const host = $('#msgs'); if (!host) return;
  const want = Object.values(LIVE).filter(v => v.channelId === UI.channelId && !v.threadOf);
  host.querySelectorAll('.thinking').forEach(n => {
    if (!want.some(v => v.agentId === n.dataset.live)) n.remove();
  });
  const atBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 160;
  want.forEach(v => {
    const existing = host.querySelector(`.thinking[data-live="${esc(v.agentId)}"]`);
    const fresh = thinkCard(v);
    if (existing) existing.innerHTML = fresh.innerHTML;
    else host.appendChild(fresh);
  });
  if (atBottom) host.scrollTop = host.scrollHeight;
}

/* ---------- attachments ----------
   Files used to be inlined into the message as data URLs, which meant every
   picture came out of the same few megabytes the whole masthead lives in. The
   bytes now go to IndexedDB and the message keeps only a reference, so what
   localStorage holds is text again. Where IndexedDB isn't available the old
   path still works — smaller, but working. */
const IDB_NAME = 'byline-blobs';
let IDB = undefined;
function idb() {
  if (IDB !== undefined) return IDB;
  IDB = new Promise(res => {
    try {
      if (typeof indexedDB === 'undefined') return res(null);
      const rq = indexedDB.open(IDB_NAME, 1);
      rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('blobs')) rq.result.createObjectStore('blobs'); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
      rq.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return IDB;
}
function idbDo(mode, fn) {
  return idb().then(db => db && new Promise((res, rej) => {
    const tx = db.transaction('blobs', mode);
    const rq = fn(tx.objectStore('blobs'));
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  })).catch(() => null);
}
const attPut = (key, blob) => idbDo('readwrite', s => s.put(blob, key));
const attGet = key => idbDo('readonly', s => s.get(key));
const attDel = key => idbDo('readwrite', s => s.delete(key));
const OBJURL = new Map();                       // ref → object URL, made once
async function attUrl(ref) {
  if (OBJURL.has(ref)) return OBJURL.get(ref);
  const blob = await attGet(ref);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  OBJURL.set(ref, u);
  return u;
}
/* Fills in every attachment on the page that lives in IndexedDB. Called after
   each paint; already-resolved refs cost nothing. */
function paintAttachments(root) {
  (root || document).querySelectorAll('[data-attref]').forEach(async el => {
    const ref = el.dataset.attref;
    if (el.dataset.attdone) return;
    const u = await attUrl(ref);
    if (!u) { el.dataset.attdone = 'missing'; return; }
    el.dataset.attdone = '1';
    if (el.tagName === 'IMG') el.src = u; else el.href = u;
  });
}
const MAX_ATT_IDB = 25 * 1024 * 1024;   // IndexedDB is roomy
const MAX_ATT = 800 * 1024;             // the localStorage fallback is not
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const fileIcon = t => /image/.test(t) ? '🖼️' : /pdf/.test(t) ? '📕' : /zip|compress/.test(t) ? '🗜️'
  : /video/.test(t) ? '🎬' : /audio/.test(t) ? '🎧' : /text|json|csv|xml/.test(t) ? '📄' : '📎';

const attHas = x => !!(x.url || x.ref);
function attHTML(m) {
  const a = m.att || []; if (!a.length) return '';
  /* a ref is filled in after paint by paintAttachments; a url is inline already */
  const src = x => x.url ? ` src="${x.url}"` : x.ref ? ` data-attref="${esc(x.ref)}"` : '';
  const href = x => x.url ? ` href="${x.url}" download="${esc(x.name)}"` : x.ref ? ` data-attref="${esc(x.ref)}" download="${esc(x.name)}"` : '';
  return `<div class="att">${a.map((x, i) => attHas(x) && /^image\//.test(x.type)
    ? `<img class="attimg"${src(x)} alt="${esc(x.name)}" data-lb="${m.id}|${i}">`
    : `<a class="attfile"${x.slackUrl && !attHas(x) ? ` href="${esc(x.slackUrl)}" target="_blank" rel="noreferrer noopener"` : href(x)}>
         <span class="ic">${fileIcon(x.type)}</span>
         <span><b>${esc(x.name)}</b><div class="tiny dimt">${fmtSize(x.size)}${attHas(x) ? ''
           : x.slackUrl ? ' · named in the Slack export, not included in it' : ' · too large to store'}</div></span></a>`
  ).join('')}</div>`;
}
async function readFiles(files) {
  const out = [];
  const db = await idb();
  for (const f of [...files]) {
    const meta = { name: f.name, size: f.size, type: f.type };
    if (db && f.size <= MAX_ATT_IDB) {
      const ref = uid('att');
      const stored = await attPut(ref, f);
      if (stored !== null) { out.push(Object.assign(meta, { ref })); continue; }
    }
    if (f.size > MAX_ATT) { out.push(meta); toast(`${f.name} is over ${fmtSize(db ? MAX_ATT_IDB : MAX_ATT)} — filed by name only`); continue; }
    out.push(Object.assign(meta, { url: await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => res(undefined);
      r.readAsDataURL(f);
    }) }));
  }
  return out.filter(x => x.name);
}
function lightbox(msgId, i) {
  const all = [].concat(...Object.values(S.messages));
  const m = all.find(x => x.id === msgId); if (!m || !m.att) return;
  const a = m.att[i];
  const mo = modal(esc(a.name), `<img ${a.url ? `src="${a.url}"` : `data-attref="${esc(a.ref || '')}"`} style="max-width:100%;border-radius:10px;margin-top:8px">
    <div class="tiny dimt" style="margin-top:8px">${fmtSize(a.size)} · ${esc(a.type || 'file')} · filed under ${esc((S.people[m.authorId] || {}).name)}'s byline</div>`,
    `<a class="btn" ${a.url ? `href="${a.url}"` : `data-attref="${esc(a.ref || '')}"`} download="${esc(a.name)}">Download</a><button class="btn primary" data-close>Close</button>`);
  paintAttachments(mo.scrim);
  return mo;
}

/* Seven buttons hang off every line. As plain tab stops that is seven per
   message — a desk of thirty puts two hundred of them between the top of the
   page and the composer — and until now they were invisible while focused,
   because only :hover revealed them. They are a toolbar: one tab stop, arrow
   keys inside it, and visible whenever anything in the line has focus. */
function wireToolbars(host) {
  host.querySelectorAll('.mtools[role="toolbar"]').forEach(bar => {
    const keys = () => [...bar.querySelectorAll('button')];
    bar.addEventListener('keydown', e => {
      const bs = keys(), at = bs.indexOf(document.activeElement);
      if (at < 0) return;
      let to = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') to = (at + 1) % bs.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') to = (at - 1 + bs.length) % bs.length;
      else if (e.key === 'Home') to = 0;
      else if (e.key === 'End') to = bs.length - 1;
      if (to === null) return;
      e.preventDefault();
      bs.forEach((b, i) => b.tabIndex = i === to ? 0 : -1);   // the stop follows the focus
      bs[to].focus();
    });
  });
}
function wireMessages(host) {
  paintAttachments(host);
  wireToolbars(host);
  const sd = host.querySelector('#staffDesk'); if (sd) sd.onclick = addPeopleModal;
  host.querySelectorAll('[data-lb]').forEach(n => n.onclick = () => { const [id, i] = n.dataset.lb.split('|'); lightbox(id, +i); });
  host.querySelectorAll('[data-rx]').forEach(b => b.onclick = () => { const [id, e] = b.dataset.rx.split('|'); react(id, e); });
  host.querySelectorAll('[data-thread]').forEach(b => b.onclick = () => openThread(b.dataset.thread));
  host.querySelectorAll('[data-activity]').forEach(b => b.onclick = () => { UI.activityFor = b.dataset.activity; UI.rpanel = 'activity'; render(); });
  host.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editMsg(b.dataset.edit));
  host.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteMsg(b.dataset.del));
  host.querySelectorAll('[data-rel]').forEach(b => b.onclick = () => releaseProposal(b.dataset.rel));
  host.querySelectorAll('[data-spike]').forEach(b => b.onclick = () => spikeProposal(b.dataset.spike));
  host.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => togglePin(b.dataset.pin));
  host.querySelectorAll('[data-unpin]').forEach(b => b.onclick = e => { e.stopPropagation(); togglePin(b.dataset.unpin); });
  host.querySelectorAll('[data-sig]').forEach(b => b.onclick = () => sigModal(b.dataset.sig));
  host.querySelectorAll('[data-emoji]').forEach(b => b.onclick = () => emojiPicker(b.dataset.emoji));
}

/* ==========================================================================
   COMPOSER
   ========================================================================== */
function paintComposer() {
  const host = $('#compHost'); if (!host) return;
  const c = chan();
  const other = c.kind === 'dm' ? S.people[c.members.find(x => x !== S.meId)] : null;
  host.innerHTML = `<div class="composer" id="comp">
      ${UI.pendingAtt.length ? `<div style="padding:9px 11px 0">${UI.pendingAtt.map((a, i) =>
    `<span class="attchip">${fileIcon(a.type)} ${esc(a.name)} <span class="dimt">${fmtSize(a.size)}</span>
       <button data-rmatt="${i}" title="Remove">✕</button></span>`).join('')}</div>` : ''}
      <textarea id="ta" rows="1" placeholder="${other ? 'Message ' + esc(other.name) : 'File to ' + chanIcon(c) + esc(c.name) + ' — @mention a correspondent to put it to work'}"></textarea>
      <div class="crow">
        <button class="iconbtn" data-act="emoji" title="Emoji">😊</button>
        <button class="iconbtn" data-act="at" title="Mention">@</button>
        <button class="iconbtn" data-act="attach" title="Attach a file">📎</button>
        ${c.kind === 'dm' ? '' : '<button class="iconbtn" data-act="canvas" title="Galley">📄</button>'}
        <span class="sp"></span>
        <span class="hint"><span class="kbd">Enter</span> send · <span class="kbd">Shift ↵</span> newline</span>
        <button class="send" id="sendBtn" ${UI.pendingAtt.length ? '' : 'disabled'}>Send</button>
      </div>
      <input type="file" id="fileIn" multiple style="display:none"></div>`;
  const ta = $('#ta'), btn = $('#sendBtn');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(190, ta.scrollHeight) + 'px'; btn.disabled = !ta.value.trim() && !UI.pendingAtt.length; };

  const addFiles = async files => {
    if (!files || !files.length) return;
    const got = await readFiles(files);
    UI.pendingAtt = UI.pendingAtt.concat(got);
    const keep = ta.value; paintComposer();
    const t2 = $('#ta'); if (t2) { t2.value = keep; t2.focus(); t2.dispatchEvent(new Event('input')); }
  };
  host.querySelector('[data-act="attach"]').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = e => addFiles(e.target.files);
  host.querySelectorAll('[data-rmatt]').forEach(b => b.onclick = () => {
    UI.pendingAtt.splice(+b.dataset.rmatt, 1);
    const keep = ta.value; paintComposer();
    const t2 = $('#ta'); if (t2) { t2.value = keep; t2.dispatchEvent(new Event('input')); }
  });
  ta.onpaste = e => {
    const f = [...(e.clipboardData.files || [])];
    if (f.length) { e.preventDefault(); addFiles(f); }
  };
  const msgHost = $('#msgs');
  if (msgHost && !msgHost.__dnd) {
    msgHost.__dnd = true;
    const stream = $('#stream');
    stream.style.position = 'relative';
    let depth = 0;
    const zone = () => stream.querySelector('.dropzone');
    stream.addEventListener('dragover', e => { e.preventDefault(); });
    stream.addEventListener('dragenter', e => {
      e.preventDefault(); depth++;
      if (!zone()) stream.appendChild(el('div', 'dropzone', '📎 Drop to attach'));
    });
    stream.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; const z = zone(); if (z) z.remove(); } });
    stream.addEventListener('drop', e => {
      e.preventDefault(); depth = 0; const z = zone(); if (z) z.remove();
      addFiles(e.dataTransfer.files);
    });
  }
  ta.oninput = () => { grow(); mentionCheck(ta, host); };
  ta.onkeydown = e => {
    if (UI.mention.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); UI.mention.idx = (UI.mention.idx + 1) % UI.mention.list.length; return paintMentionPop(host, ta); }
      if (e.key === 'ArrowUp') { e.preventDefault(); UI.mention.idx = (UI.mention.idx - 1 + UI.mention.list.length) % UI.mention.list.length; return paintMentionPop(host, ta); }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return applyMention(ta, host); }
      if (e.key === 'Escape') { UI.mention.open = false; return paintMentionPop(host, ta); }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(ta); }
  };
  btn.onclick = () => doSend(ta);
  host.querySelector('[data-act="emoji"]').onclick = () => { ta.value += pick(EMOJI); grow(); ta.focus(); };
  host.querySelector('[data-act="at"]').onclick = () => { ta.value += '@'; ta.focus(); grow(); mentionCheck(ta, host); };
  const cb = host.querySelector('[data-act="canvas"]'); if (cb) cb.onclick = () => { UI.tab = 'canvas'; render(); };
  setTimeout(() => ta.focus(), 30);
}
function mentionCheck(ta, host) {
  const before = ta.value.slice(0, ta.selectionStart);
  const m = before.match(/@([a-z0-9_-]*)$/i);
  if (!m) { UI.mention.open = false; return paintMentionPop(host, ta); }
  const q = m[1].toLowerCase(), c = chan();
  const pool = c.members.map(id => S.people[id]).filter(p => p && !p.me);
  UI.mention.list = pool.filter(p => p.handle.includes(q) || p.name.toLowerCase().includes(q)).slice(0, 6);
  UI.mention.open = UI.mention.list.length > 0; UI.mention.idx = 0;
  paintMentionPop(host, ta);
}
function paintMentionPop(host, ta) {
  const old = host.querySelector('.mentionPop'); if (old) old.remove();
  if (!UI.mention.open) return;
  const pop = el('div', 'mentionPop', UI.mention.list.map((p, i) =>
    `<div class="it ${i === UI.mention.idx ? 'on' : ''}" data-i="${i}">${avatar(p)}
      <div style="flex:1"><b>${esc(p.name)}</b> <span class="d">@${esc(p.handle)}</span></div>
      ${p.type === 'agent' ? `<span class="pill ag">${esc(harnessOf(p).icon)} correspondent</span>` : ''}</div>`).join(''));
  pop.querySelectorAll('.it').forEach(n => n.onclick = () => { UI.mention.idx = +n.dataset.i; applyMention(ta, host); });
  host.appendChild(pop);
}
function applyMention(ta, host) {
  const p = UI.mention.list[UI.mention.idx]; if (!p) return;
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0, s).replace(/@([a-z0-9_-]*)$/i, '@' + p.handle + ' ') + ta.value.slice(s);
  UI.mention.open = false; paintMentionPop(host, ta);
  ta.focus(); ta.dispatchEvent(new Event('input'));
}

/* ==========================================================================
   MESSAGING
   ========================================================================== */
/* While QUIET is raised, postMessage skips its per-line save. A Slack export
   of a few thousand lines used to serialise the entire masthead once per line
   — tens of seconds with the tab frozen — for a single import. */
let QUIET = 0;
function postMessage({ channelId, authorId, text, kind, threadOf, activity, tokens, harness, att }) {
  const m = { id: uid('m'), channelId, authorId, text, ts: now(), kind: kind || 'msg', reactions: {}, threadOf: threadOf || null, replies: 0 };
  if (att && att.length) m.att = att;
  if (activity) { m.activity = activity; m.tokens = tokens; m.harness = harness; }
  const author = S.people[authorId];
  m.sig = sign(m, author.sec);                       // immediate, so rendering never waits
  if (hasPriv(author) && SUBTLE) signAsync(m, author);    // upgraded to a real ECDSA byline
  (S.messages[channelId] = S.messages[channelId] || []).push(m);

  const c = chan(channelId);
  const mine = authorId === S.meId;
  if (threadOf) {
    const parent = msgs(channelId).find(x => x.id === threadOf);
    if (parent) {
      parent.replies = (parent.replies || 0) + 1; parent.lastReply = m.ts;
      // unread on the thread unless you are looking straight at it
      const watching = UI.channelId === channelId && UI.rpanel === 'thread' && UI.threadId === threadOf;
      if (!mine && !watching) parent.unseen = (parent.unseen || 0) + 1;
    }
  }
  if (c && !mine && kind !== 'system') {
    const looking = UI.view === 'channel' && UI.channelId === channelId && (!threadOf || (UI.rpanel === 'thread' && UI.threadId === threadOf));
    if (!looking) c.unread = (c.unread || 0) + 1;
    const who = (S.people[authorId] || {}).name || 'Someone';
    const mentionsMe = new RegExp('@' + (me().handle || '\u0000'), 'i').test(text || '');
    if (mentionsMe || !looking) notify(`${who} · ${chanIcon(c)}${chanName(c)}`, text);
  }
  logEvent('message.created', { channel: channelId, message: m.id }, authorId);
  if (!QUIET) save();
  /* the author rides along so the far side can attribute and verify the line
     without having synced first — which needs their public key and nothing
     else. Sending the person object itself sent their private one too. */
  peerSend({ op: 'message', m, author: publicPerson(S.people[authorId]) });   // straight down the wire to a peer
  return m;
}
function doSend(ta) {
  const text = ta.value.trim();
  const att = UI.pendingAtt.slice();
  if (!text && !att.length) return;
  ta.value = ''; ta.style.height = 'auto'; $('#sendBtn').disabled = true;
  UI.pendingAtt = [];
  const c = chan();
  const m = postMessage({ channelId: c.id, authorId: S.meId, text, threadOf: UI.threadId || null, att });
  if (att.length) paintComposer();
  if (UI.threadId) renderRPanel();
  paintMessages();
  runWorkflows('message.created', { message: m, actor: me(), channel: c });
  wakeAgents(m, c);
}
function react(msgId, emoji) {
  const all = [].concat(...Object.values(S.messages));
  const m = all.find(x => x.id === msgId); if (!m) return;
  m.reactions = m.reactions || {};
  const arr = m.reactions[emoji] = m.reactions[emoji] || [];
  const i = arr.indexOf(S.meId), added = i < 0;
  if (added) arr.push(S.meId); else arr.splice(i, 1);
  if (!arr.length) delete m.reactions[emoji];
  logEvent(added ? 'reaction.added' : 'reaction.removed', { message: m.id, emoji });
  save(); paintMessages();
  if (UI.rpanel === 'thread') renderRPanel();
  if (added) peerSend({ op: 'reaction', id: m.id, emoji, by: S.meId });
  if (added) runWorkflows('reaction.added', { message: m, actor: me(), emoji, channel: chan(m.channelId) });
}
/* Editing re-signs. The old text is kept so the change is visible rather than
   silent — a byline that quietly covers new words is worth less than one that
   shows what it used to cover. */
function editMsg(id) {
  const c = chan();
  const m = msgs(c.id).find(x => x.id === id); if (!m) return;
  if (m.authorId !== S.meId) return toast('You can only edit copy filed under your own byline');
  const mo = modal('Edit filed copy', `
    <div class="tiny mut" style="margin:6px 0 10px">This re-signs the line under your key. The previous wording is kept and shown as an edit.</div>
    <textarea class="i" id="edTa" style="min-height:130px;font-family:var(--serif);font-size:15px">${esc(m.text)}</textarea>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="edGo">Re-file</button>`);
  mo.q('#edGo').onclick = () => {
    const t = mo.q('#edTa').value.trim();
    if (!t || t === m.text) { mo.close(); return; }
    m.edits = (m.edits || []).concat([{ text: m.text, at: now() }]);
    m.text = t; m.editedAt = now();
    m.sig = sign(m, S.people[m.authorId].sec);          // legacy digest immediately…
    delete m.alg; VERIFIED.clear();
    const author = S.people[m.authorId];
    if (hasPriv(author) && SUBTLE) signAsync(m, author);      // …upgraded to a real signature
    logEvent('message.edited', { message: m.id, channel: c.id });
    save(); mo.close(); paintMessages();
    toast('Re-filed and re-signed', true);
  };
  setTimeout(() => mo.q('#edTa').focus(), 40);
}
