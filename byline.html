/* ==========================================================================
   AGENT ENGINE
   ========================================================================== */
/* ==========================================================================
   LIVE MODEL — Ollama on localhost. Everything the correspondent knows is
   assembled here: its brief, its memories, the desk galley and the recent run.
   If the model is unreachable we fall back to the written reply, and say so.
   ========================================================================== */
const LIVE_CFG = () => S.settings.live || (S.settings.live = { on: false, provider: 'ollama', url: 'http://localhost:11434', model: '', models: [], status: 'unchecked', key: '', amodel: 'claude-opus-5' });
/* Model IDs are exact — no date suffixes. Opus 5 is the default. */
const CLAUDE_MODELS = [
  { id: 'claude-opus-5', name: 'Claude Opus 5', note: 'most capable — the default' },
  { id: 'claude-sonnet-5', name: 'Claude Sonnet 5', note: 'near-Opus quality, cheaper' },
  { id: 'claude-haiku-4-5', name: 'Claude Haiku 4.5', note: 'fastest, for simple replies' },
];

async function probeOllama(url) {
  const base = (url || LIVE_CFG().url).replace(/\/+$/, '');
  try {
    const r = await fetch(base + '/api/tags', { method: 'GET' });
    if (!r.ok) return { ok: false, err: 'HTTP ' + r.status };
    const j = await r.json();
    return { ok: true, models: (j.models || []).map(m => m.name) };
  } catch (e) {
    return { ok: false, err: /Failed to fetch|NetworkError/i.test(String(e.message)) ? 'unreachable (is Ollama running? CORS may need OLLAMA_ORIGINS=*)' : String(e.message) };
  }
}

function buildPrompt(agent, trigger, c) {
  const recent = msgs(c.id).filter(m => m.kind !== 'system').slice(-20)
    .map(m => `${(S.people[m.authorId] || {}).name || '?'}: ${m.text}`).join('\n');
  const mem = (agent.memories || []).length ? `\nStanding instructions you have been given before:\n- ${agent.memories.join('\n- ')}` : '';
  const GALLEY_MAX = 2000;
  const gtext = (c.canvas && c.canvas.text) || '';
  /* A brief cut off without saying so hands the model half a plan and lets
     it believe it has the whole thing. Cut it, but say where and by how much. */
  const gshown = gtext.length > GALLEY_MAX
    ? gtext.slice(0, GALLEY_MAX) + `
[… the brief continues for ${(gtext.length - GALLEY_MAX).toLocaleString()} more characters that are not included here — ask if you need the rest]`
    : gtext;
  const galley = gtext ? `
The desk galley (shared brief every correspondent reads):
"""
${gshown}
"""` : '';
  const system = `${agent.instructions || 'You are a helpful correspondent.'}
${mem}
You are ${agent.name}, a correspondent on the desk ${chanIcon(c)}${chanName(c)} of ${S.workspace.name}.
You are talking to colleagues in a work chat. Reply as yourself, in the chat, in plain prose.
Do not roleplay stage directions, do not prefix your name, do not explain that you are an AI.
Keep it tight — a few short paragraphs at most.${galley}`;
  const user = `Recent copy on this desk:\n${recent}\n\n${(S.people[trigger.authorId] || {}).name} has just asked you:\n${trigger.text.replace(/@[a-z0-9_-]+/gi, '').trim()}`;
  return { system, user };
}

/* A model that accepts the request and then never emits a token would wedge a
   correspondent forever, so every call is bounded: an overall deadline, a
   first-token watchdog, and a non-streaming retry when the stream stays dry. */
async function ollamaChat(body, opts) {
  opts = opts || {};
  const base = LIVE_CFG().url.replace(/\/+$/, '');
  const ctrl = new AbortController();
  let reason = 'timed out';
  const overall = setTimeout(() => { reason = `no reply within ${Math.round((opts.timeout || 90000) / 1000)}s`; ctrl.abort(); }, opts.timeout || 90000);
  let watchdog = null, lastByte = Date.now();
  try {
    const r = await fetch(base + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: ctrl.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (!body.stream) {
      const j = await r.json();
      return { text: ((j.message && j.message.content) || '').trim(), tokens: (j.eval_count || 0) + (j.prompt_eval_count || 0) };
    }
    if (!r.body) throw new Error('no response body');
    if (opts.firstToken) {
      watchdog = setInterval(() => {
        if (Date.now() - lastByte > opts.firstToken) { reason = `model produced nothing for ${Math.round(opts.firstToken / 1000)}s`; ctrl.abort(); }
      }, 1000);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', tokens = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      lastByte = Date.now();
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.trim()) continue;
        let j; try { j = JSON.parse(ln); } catch (e) { continue; }
        if (j.message && j.message.content) { text += j.message.content; if (opts.onChunk) opts.onChunk(text); }
        if (j.eval_count) tokens = j.eval_count + (j.prompt_eval_count || 0);
      }
    }
    return { text: text.trim(), tokens };
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(reason);
    throw e;
  } finally { clearTimeout(overall); if (watchdog) clearInterval(watchdog); }
}

async function askOllama(agent, trigger, c, onChunk) {
  const cfg = LIVE_CFG();
  const { system, user } = buildPrompt(agent, trigger, c);
  const model = cfg.model || cfg.models[0] || 'llama3.2';
  const messages = [{ role: 'system', content: system }, { role: 'user', content: user }];
  try {
    const out = await ollamaChat({ model, messages, stream: true }, { timeout: 90000, firstToken: 20000, onChunk });
    if (out.text) return out;
    throw new Error('stream returned nothing');
  } catch (e) {
    // only worth a second attempt if the stream stalled — a refused connection
    // or a bad host will fail identically, and waiting twice helps nobody
    const stalled = /produced nothing|no reply within|returned nothing/i.test(e.message || '');
    if (!stalled) throw e;
    if (onChunk) onChunk('(stream stalled — retrying without streaming)');
    return await ollamaChat({ model, messages, stream: false }, { timeout: 90000 });
  }
}

/* Claude via the Messages API, straight from the browser.
   Thinking is ON by default on Opus 5 and counts against max_tokens, so the
   budget is generous and effort is dialled down for short desk replies. */
async function askClaude(agent, trigger, c, onChunk) {
  const cfg = LIVE_CFG();
  if (!secret('apiKey')) throw new Error(cfg.keyEnc ? 'the API key is locked — unlock the masthead first' : 'no API key set');
  const { system, user } = buildPrompt(agent, trigger, c);
  const ctrl = new AbortController();
  let reason = 'timed out';
  const overall = setTimeout(() => { reason = 'no reply within 90s'; ctrl.abort(); }, 90000);
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': secret('apiKey'),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: cfg.amodel || 'claude-opus-5',
        max_tokens: 4000,
        stream: true,
        system,
        output_config: { effort: 'low' },   // short replies; no temperature — 400s on Opus 5
        messages: [{ role: 'user', content: user }],
      }),
      signal: ctrl.signal,
    });
    if (!r.ok) {
      let detail = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j.error && j.error.message) detail = j.error.message; } catch (e) { }
      throw new Error(detail);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', tokens = 0, stop = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;          // skip `event:` lines
        const payload = ln.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let j; try { j = JSON.parse(payload); } catch (e) { continue; }
        if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') {
          text += j.delta.text; if (onChunk) onChunk(text);
        }
        if (j.type === 'message_start' && j.message && j.message.usage) tokens += j.message.usage.input_tokens || 0;
        if (j.type === 'message_delta') {
          if (j.usage) tokens += j.usage.output_tokens || 0;
          if (j.delta && j.delta.stop_reason) stop = j.delta.stop_reason;
        }
        if (j.type === 'error') throw new Error((j.error && j.error.message) || 'stream error');
      }
    }
    // a safety decline arrives as a normal 200 with stop_reason "refusal"
    if (stop === 'refusal') throw new Error('the model declined this request (refusal)');
    return { text: text.trim(), tokens };
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(reason);
    throw e;
  } finally { clearTimeout(overall); }
}

const askModel = (agent, trigger, c, onChunk) =>
  LIVE_CFG().provider === 'claude' ? askClaude(agent, trigger, c, onChunk) : askOllama(agent, trigger, c, onChunk);
const liveModelName = () => { const cfg = LIVE_CFG(); return cfg.provider === 'claude' ? (cfg.amodel || 'claude-opus-5') : cfg.model; };

/* ==========================================================================
   PERMISSIONS
   Two independent things: what a *person* may do on a desk (roles), and what a
   *correspondent* may do before a human says yes (policy). The second is the
   one that matters — accountability applied forward instead of after the fact.
   ========================================================================== */
const ROLES = {
  owner: { name: 'Owner', can: { file: 1, staff: 1, wire: 1, revoke: 1, redact: 1, approve: 1 } },
  editor: { name: 'Editor', can: { file: 1, staff: 1, wire: 1, approve: 1 } },
  writer: { name: 'Writer', can: { file: 1 } },
  reader: { name: 'Reader', can: {} },
};
const roleOfPerson = p => p && p.role_ ? p.role_ : (p && p.id === OWNER ? 'owner' : 'editor');
const can = (act, p) => !!(ROLES[roleOfPerson(p || me())] || ROLES.reader).can[act];
function refuse(act) {
  toast(`Your role (${ROLES[roleOfPerson(me())].name}) cannot ${act} on this masthead`);
  return false;
}

/* A correspondent's policy governs the moment before it files. `always_ask`
   holds its copy as a proposal until a human with approve rights releases it. */
const POLICIES = {
  always_allow: { name: 'Files directly', hint: 'Anything it writes goes straight onto the desk.' },
  always_ask: { name: 'Asks first', hint: 'Its copy is held as a proposal until you release it.' },
  read_only: { name: 'Reads only', hint: 'It can be mentioned but never files.' },
};
const policyOf = a => POLICIES[a && a.policy] ? a.policy : 'always_allow';

/* Held copy lives in the record as a pending proposal, not a filed line. */
function holdProposal(agent, c, text, extra) {
  const p = {
    id: uid('prop'), channelId: c.id, authorId: agent.id, text,
    ts: now(), activity: (extra || {}).activity, tokens: (extra || {}).tokens,
    harness: (extra || {}).harness, threadOf: (extra || {}).threadOf || null,
  };
  (S.proposals = S.proposals || []).push(p);
  logEvent('proposal.held', { correspondent: agent.name, channel: c.id }, agent.id);
  save();
  return p;
}
function releaseProposal(id) {
  if (!can('approve')) return refuse('approve copy');
  const i = (S.proposals || []).findIndex(p => p.id === id); if (i < 0) return;
  const p = S.proposals.splice(i, 1)[0];
  const c = chan(p.channelId); if (!c) return;
  const m = postMessage({
    channelId: p.channelId, authorId: p.authorId, text: p.text, threadOf: p.threadOf,
    activity: p.activity, tokens: p.tokens, harness: p.harness,
  });
  logEvent('proposal.released', { proposal: id, message: m.id, by: me().name });
  save(); render();
  toast('Released — it now carries its byline on the desk', true);
  runWorkflows('message.created', { message: m, actor: S.people[p.authorId], channel: c });
}
function spikeProposal(id) {
  if (!can('approve')) return refuse('approve copy');
  const i = (S.proposals || []).findIndex(p => p.id === id); if (i < 0) return;
  const p = S.proposals.splice(i, 1)[0];
  logEvent('proposal.spiked', { proposal: id, correspondent: (S.people[p.authorId] || {}).name });
  save(); render(); toast('Spiked — it never reached the desk');
}

function roleOf(a) {
  if (a.role) return a.role;
  const i = (a.instructions || '').toLowerCase();
  if (/delegat|chief of staff|orchestrat/.test(i)) return 'chief';
  if (/research|investigate|cite|sources/.test(i)) return 'research';
  if (/write|post|draft|copy|linkedin/.test(i)) return 'writer';
  if (/review|pull request|\bpr\b|tests?\b/.test(i)) return 'reviewer';
  return 'helper';
}

function wakeAgents(m, c) {
  let targets;
  if (c.kind === 'dm') {
    const other = S.people[c.members.find(x => x !== S.meId)];
    targets = other && other.type === 'agent' ? [other] : [];
  } else {
    targets = (m.text.match(/@([a-z0-9_-]+)/gi) || [])
      .map(x => x.slice(1).toLowerCase())
      .map(h => Object.values(S.people).find(p => p.handle === h && p.type === 'agent'))
      .filter(Boolean).filter(a => c.members.includes(a.id));
    targets = targets.filter((a, i) => targets.indexOf(a) === i);
  }
  targets.forEach((a, i) => setTimeout(() => runAgent(a, m, c), 350 + i * 800));
}

function topicOf(text) {
  let t = text.replace(/@[a-z0-9_-]+/gi, '').trim();
  t = t.replace(/^(please|hey|ok|okay|right)[,\s]+/i, '');
  t = t.replace(/^(write|draft|make|build|give me|do|create|get)\s+(me\s+)?(a|an|the)?\s*/i, '');
  return t.replace(/[.!?]+$/, '').trim() || 'the thing we just discussed';
}

/* memory extraction — the agent notices standing preferences */
function extractMemory(text) {
  const t = text.replace(/@[a-z0-9_-]+/gi, '').trim();
  const pats = [
    /(?:remember|commit to your memory|note)\s*(?:that)?\s*[:,]?\s*(.+)/i,
    /\b(?:i|we)\s+(?:really\s+)?(?:like|prefer|hate|always|never)\b[^.!?]*/i,
    /\byou should always\b[^.!?]*/i,
    /\balways\s+(?:talk|speak|write|reply)[^.!?]*/i,
  ];
  for (const p of pats) {
    const m = t.match(p);
    if (m) {
      let s = (m[1] || m[0]).trim().replace(/^(that|to)\s+/i, '');
      s = s.charAt(0).toUpperCase() + s.slice(1);
      if (s.length > 4) return s.length > 160 ? s.slice(0, 157) + '…' : s;
    }
  }
  return null;
}

/* A correspondent hosted on this machine dies with the lid. One on a gateway
   does not — same keypair, same memories, answers while you're asleep. */
const hostOf = a => (a.host === 'gateway' && S.settings.gateway.on) ? 'gateway' : 'local';
const reachable = a => !a.offline && (hostOf(a) === 'gateway' || !S.settings.away);

async function runAgent(agent, trigger, c) {
  if (agent.offline) {
    postMessage({ channelId: c.id, authorId: S.meId, text: `**${agent.name}** is off the desk — restart it after the harness change.`, kind: 'system' });
    return paintMessages();
  }
  if (!reachable(agent)) {
    S.queue.push({ agentId: agent.id, msgId: trigger.id, channelId: c.id });
    postMessage({
      channelId: c.id, authorId: S.meId, kind: 'system',
      text: `🌙 **${agent.name}** runs on this machine, and this machine is asleep. Mention queued — it'll pick this up when you're back. *Move it to the gateway in Settings and it would have answered already.*`
    });
    save(); paintMessages(); renderSidebar();
    return;
  }
  if (agent.busy) {
    toast(`${agent.name} is mid-run — it'll pick this up next`);
    return;
  }
  agent.busy = true; renderSidebar(); renderRail();

  const h = harnessOf(agent);
  const role = roleOf(agent);
  const topic = topicOf(trigger.text);
  const nMsgs = msgs(c.id).length;

  /* If it was told to hand this to someone else, it does that itself. */
  if (c.kind !== 'dm' && await relayToPeer(agent, c, trigger)) {
    agent.busy = false; renderSidebar(); renderRail();
    await agentReply(agent, c, trigger.id, `Passed this to **${(/\b(?:ask|check with|hand (?:this|it) to|pass (?:this|it) to)\s+@?([a-z0-9_-]{2,20})\b/i.exec(trigger.text) || [])[1]}** — it's their beat. Their answer is in our DMs, on the record.`);
    return;
  }

  LIVE[agent.id] = { agentId: agent.id, channelId: c.id, threadOf: trigger.threadOf, acts: [], tokens: 0, harness: h.id };
  if (trigger.threadOf) { if (UI.rpanel === 'thread') renderRPanel(); } else paintMessages();
  react2(trigger, '👀', agent.id);

  const cfg = LIVE_CFG();
  const lname = liveModelName();
  const goLive = cfg.on && !!lname && (cfg.provider !== 'claude' || !!secret('apiKey'));
  const acts = [];
  let toolset = goLive
    ? [['memory', `load ${(agent.memories || []).length} core memories`], ['Read', `desk history — {N} messages`], ['galley', 'read the shared brief'], [lname, 'generating…']]
    : h.tools.slice();
  if (role === 'chief' && !goLive) toolset.push(['delegate', 'pick owners + spin up a channel']);
  if (!goLive && agent.memories && agent.memories.length) toolset.unshift(['memory', `load ${agent.memories.length} core memor${agent.memories.length === 1 ? 'y' : 'ies'}`]);

  /* live path: real generation, streamed into the activity card */
  if (goLive) {
    const L = LIVE[agent.id];
    L.acts = toolset.slice(0, 3).map(([tool, det]) => ({ tool, detail: det.replace('{N}', nMsgs) }));
    if (UI.channelId === c.id) syncThinking();
    let out = null, failed = null;
    try {
      out = await askModel(agent, trigger, c, partial => {
        const LL = LIVE[agent.id]; if (!LL) return;
        LL.acts = L.acts.concat([{ tool: lname, detail: partial.slice(-90).replace(/\s+/g, ' ') }]);
        LL.tokens = Math.round(partial.length / 4);
        if (UI.channelId === c.id && !trigger.threadOf) syncThinking();
        else if (UI.rpanel === 'thread') renderRPanel();
      });
    } catch (e) { failed = e.message || String(e); }
    delete LIVE[agent.id];
    agent.busy = false;

    if (out && out.text) {
      const mem2 = extractMemory(trigger.text);
      if (mem2) { agent.memories = agent.memories || []; if (!agent.memories.includes(mem2)) agent.memories.unshift(mem2); }
      const acts2 = L.acts.concat([{ tool: lname, detail: `${out.tokens || '~'} tokens · ${cfg.provider === 'claude' ? 'Claude API' : 'local · no API bill'}` }]);
      /* TM-011, and worse than it was rated. This path filed without asking
         what the correspondent may do: a withdrawn delegation, "reads only",
         "asks first" — all ignored the moment a real model answered. Live
         copy now passes the same gate as scripted copy, and on top of that it
         is held for release unless its owner chose "files directly" for this
         correspondent: a model reading a desk can be steered by what is
         written on it, and the byline would make that copy look settled. */
      const liveText = out.text + (mem2 ? `\n\n> 🧠 Filed to memory: *${mem2}*` : '');
      const effL = await effectiveScope(agent);
      const settleL = () => { renderSidebar(); renderRail(); if (UI.channelId === c.id) render(); save(); };
      if (effL.from === 'broken') {
        postMessage({ channelId: c.id, authorId: S.meId, kind: 'system', text: `**${agent.name}** did the work but filed nothing: its delegation no longer holds — ${effL.why}.` });
        return settleL();
      }
      let polL = effL.scope.indexOf('desk:file') >= 0 ? 'always_allow' : effL.scope.indexOf('desk:propose') >= 0 ? 'always_ask' : 'read_only';
      if (polL === 'always_allow' && agent.policy !== 'always_allow') polL = 'always_ask';
      if (polL === 'read_only') {
        postMessage({ channelId: c.id, authorId: S.meId, kind: 'system', text: `**${agent.name}** did the work but filed nothing — ${effL.from === 'credential' ? 'its credential does not grant filing' : 'it is set to read only'}.` });
        return settleL();
      }
      if (polL === 'always_ask') {
        holdProposal(agent, c, liveText, { activity: acts2, tokens: out.tokens || 0, harness: h.id, threadOf: trigger.threadOf, live: true });
        toast(`${agent.name}’s copy came from a live model, and is waiting for you to release it`);
        return settleL();
      }
      const mm = postMessage({
        channelId: c.id, authorId: agent.id, text: out.text + (mem2 ? `\n\n> 🧠 Filed to memory: *${mem2}*` : ''),
        threadOf: trigger.threadOf || null, activity: acts2, tokens: out.tokens || 0, harness: h.id
      });
      mm.live = true;
      if (UI.channelId === c.id) { paintMessages(); if (UI.rpanel) renderRPanel(); }
      renderSidebar(); renderRail();
      runWorkflows('message.created', { message: mm, actor: agent, channel: c });
      save();
      return;
    }
    cfg.status = 'error: ' + failed;
    postMessage({ channelId: c.id, authorId: S.meId, kind: 'system', text: `⚠️ Live model unreachable (${esc(failed || 'empty reply')}) — **${agent.name}** fell back to its written reply.` });
    agent.busy = true;   // continue down the scripted path below
    toolset = h.tools.slice();
    if (role === 'chief') toolset.push(['delegate', 'pick owners + spin up a channel']);
    LIVE[agent.id] = { agentId: agent.id, channelId: c.id, threadOf: trigger.threadOf, acts: [], tokens: 0, harness: h.id };
    if (UI.channelId === c.id) paintMessages();
  }

  for (const [tool, det] of toolset) {
    await sleep(480 + Math.random() * 560);
    const detail = det.replace('{topic}', topic.slice(0, 42)).replace('{N}', nMsgs);
    acts.push({ tool, detail });
    const L = LIVE[agent.id]; if (!L) break;
    L.acts = acts; L.tokens += Math.floor(500 + Math.random() * 2400);
    if (trigger.threadOf) { if (UI.rpanel === 'thread') renderRPanel(); }
    else if (UI.channelId === c.id && UI.tab === 'chat') syncThinking();
    if (UI.rpanel === 'activity') renderRPanel();
  }
  const tokens = (LIVE[agent.id] || {}).tokens || 0;
  delete LIVE[agent.id];

  // memory
  const mem = extractMemory(trigger.text);
  let memNote = '';
  if (mem) {
    agent.memories = agent.memories || [];
    if (!agent.memories.includes(mem)) agent.memories.unshift(mem);
    logEvent('memory.written', { agent: agent.name, memory: mem }, agent.id);
    memNote = `\n\n> 🧠 Filed to memory: *${mem}*`;
  }

  // canvas writes
  if ((role === 'research' || role === 'chief') && c.kind !== 'dm' && /brief|research|outline|canvas|plan/i.test(trigger.text)) {
    c.canvas.text = briefCanvas(topic, agent);
    c.canvas.by = agent.id; c.canvas.at = now(); c.canvas.v = (c.canvas.v || 0) + 1;
    logEvent('canvas.updated', { channel: c.id, version: c.canvas.v }, agent.id);
  }

  const text = composeReply(agent, role, trigger, c, topic) + memNote;
  /* The credential is the authority, not decoration — if it doesn't grant
     filing, the copy doesn't land, whatever the card says. */
  const eff = await effectiveScope(agent);
  if (eff.from === 'broken') {
    agent.busy = false;
    postMessage({ channelId: c.id, authorId: S.meId, kind: 'system', text: `**${agent.name}** did the work but filed nothing: its delegation no longer holds — ${eff.why}.` });
    renderSidebar(); renderRail(); if (UI.channelId === c.id) paintMessages();
    save(); return;
  }
  const pol = eff.scope.indexOf('desk:file') >= 0 ? 'always_allow'
            : eff.scope.indexOf('desk:propose') >= 0 ? 'always_ask' : 'read_only';
  if (pol === 'read_only') {
    agent.busy = false;
    const why = eff.from === 'credential' ? 'its credential does not grant filing' : 'it is set to read only';
    postMessage({ channelId: c.id, authorId: S.meId, kind: 'system', text: `**${agent.name}** did the work but filed nothing — ${why}.` });
    renderSidebar(); renderRail(); if (UI.channelId === c.id) paintMessages();
    save(); return;
  }
  if (pol === 'always_ask') {
    holdProposal(agent, c, text, { activity: acts, tokens, harness: h.id, threadOf: trigger.threadOf });
    agent.busy = false;
    renderSidebar(); renderRail(); if (UI.channelId === c.id) render();
    toast(`${agent.name} is waiting on you to release its copy`);
    return;
  }
  const m = postMessage({
    channelId: c.id, authorId: agent.id, text,
    threadOf: trigger.threadOf || null, activity: acts, tokens, harness: h.id
  });

  agent.busy = false;
  if (UI.channelId === c.id) { paintMessages(); if (UI.rpanel) renderRPanel(); }
  renderSidebar(); renderRail();
  runWorkflows('message.created', { message: m, actor: agent, channel: c });

  if (role === 'chief' && !trigger.threadOf && c.kind !== 'dm') delegate(agent, m, topic, c);
  save();
}

/* When the chief staffs a desk it hands down part of its own authority, and
   the credential it issues names the one it holds as its parent. Never more
   than it has, never outliving it, and revoking the chief's cuts every branch
   below it in the same stroke. */
async function subDelegate(chief, staff, nc, topic) {
  const held = await effectiveScope(chief);
  if (held.from === 'broken') return;
  const pass = held.scope.filter(s => s !== 'delegate' && s !== 'desk:create');
  const ends = Date.parse(chief.delegation.validUntil || 0) || (now() + 7 * 864e5);
  const days = Math.max(1, Math.floor((ends - now()) / 864e5));
  for (const a of staff.filter((v, i, s) => v && s.indexOf(v) === i)) {
    try {
      const vc = delegationCredential(chief, a, pass, days, chief.delegation);
      a.delegation = await issueVC(vc, chief);
      logEvent('delegation.issued', {
        to: a.name, by: chief.name, scope: pass, desk: nc.name, topic,
        depth: (await verifyDelegation(a.delegation)).depth,
      }, chief.id);
    } catch (e) { /* an unsigned correspondent simply keeps its card policy */ }
  }
  save();
}

/* the headline: chief of staff spins up a channel, staffs it, briefs it */
async function delegate(chief, rootMsg, topic, fromChan) {
  const helpers = agents().filter(a => a.id !== chief.id && !a.offline);
  const researcher = helpers.find(a => roleOf(a) === 'research') || helpers[0];
  const writer = helpers.find(a => roleOf(a) === 'writer') || helpers[1] || helpers[0];
  if (!researcher) return;

  const eff = await effectiveScope(chief);
  const short = eff.scope.indexOf('desk:create') < 0 ? 'open a desk'
              : eff.scope.indexOf('delegate') < 0 ? 'put anyone else on it' : null;
  if (short) {
    await agentReply(chief, fromChan, rootMsg.id, `I'd staff this out, but I'm not authorised to ${short}. Widen my delegation and I'll go.`);
    return;
  }

  await sleep(900);
  const base = topic.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 3).join('-') || 'story';
  let slug = base;
  for (let n = 2; S.channels.some(x => x.name === slug); n++) slug = base + '-' + n;
  const nc = {
    id: uid('c'), kind: 'channel', name: slug, topic: 'Spun up by Fizz — ' + topic, private: false,
    members: [S.meId, chief.id, researcher.id, writer.id].filter((v, i, s) => s.indexOf(v) === i),
    canvas: { text: briefCanvas(topic, chief), by: chief.id, at: now(), v: 1 }, created: now(), unread: 0
  };
  S.channels.push(nc); S.messages[nc.id] = [];
  logEvent('channel.created', { channel: nc.name, by: 'agent' }, chief.id);
  if (chief.delegation) await subDelegate(chief, [researcher, writer], nc, topic);
  postMessage({ channelId: nc.id, authorId: chief.id, text: `**${researcher.name}**, **${writer.name}** and **${me().name}** put on this desk by ${chief.name}.`, kind: 'system' });
  renderSidebar();
  toast(`${chief.name} opened #${slug} and staffed it`, true);

  await agentReply(chief, fromChan, rootMsg.id, `Opened **#${slug}** and put ${researcher.name} and ${writer.name} on it. Brief is on that desk's galley — I'll file back here when it's done.`);

  const brief = postMessage({
    channelId: nc.id, authorId: chief.id,
    text: `Brief is on the galley. @${researcher.handle} you're up — primary sources only, cite everything, outline on the galley when you're done. @${writer.handle} draft from that outline the moment it lands.\n\nStory: **${topic}**`
  });
  if (UI.channelId === nc.id) paintMessages();

  await sleep(600);
  await runAgentQuiet(researcher, brief, nc, `Outline is on the galley (v${nc.canvas.v + 1}).\n\nFour claims, all sourced. Two I could only get to secondary coverage — I've marked those *unsourced* rather than dress them up.\n\n@${writer.handle} you're up.`);
  await sleep(400);
  await runAgentQuiet(writer, brief, nc, `Drafted from ${researcher.name}'s outline.\n\nHeld the shape to: the objection first, the claim second, the demonstration third. No preamble, no hashtag salad. It's on the galley beside the outline, so the citations sit next to the sentences they carry.\n\n@${chief.handle} ready to sub.`);
  await sleep(500);

  const done = postMessage({
    channelId: fromChan.id, authorId: chief.id, threadOf: rootMsg.id,
    text: `Filed. ${researcher.name} sourced it, ${writer.name} wrote it, both on **#${slug}**'s galley.\n\nTwo claims are marked unsourced — I'd cut them rather than soften them. Your call.`
  });
  const parent = msgs(fromChan.id).find(x => x.id === rootMsg.id);
  react2(parent, '✅', chief.id);
  if (UI.channelId === fromChan.id) { paintMessages(); if (UI.rpanel === 'thread') renderRPanel(); }
  save();
}

async function runAgentQuiet(agent, trigger, c, text) {
  agent.busy = true; renderSidebar();
  const h = harnessOf(agent);
  LIVE[agent.id] = { agentId: agent.id, channelId: c.id, threadOf: trigger.threadOf, acts: [], tokens: 0, harness: h.id };
  const acts = [];
  for (const [tool, det] of h.tools.slice(0, 3)) {
    await sleep(520);
    acts.push({ tool, detail: det.replace('{topic}', c.name).replace('{N}', msgs(c.id).length) });
    const L = LIVE[agent.id]; if (!L) break;
    L.acts = acts; L.tokens += Math.floor(700 + Math.random() * 1800);
    if (UI.channelId === c.id) syncThinking();
  }
  const tokens = (LIVE[agent.id] || {}).tokens || 0;
  delete LIVE[agent.id];
  if (roleOf(agent) === 'research') { c.canvas.v++; c.canvas.at = now(); c.canvas.by = agent.id; }
  postMessage({ channelId: c.id, authorId: agent.id, text, threadOf: trigger.threadOf || null, activity: acts, tokens, harness: h.id });
  agent.busy = false;
  if (UI.channelId === c.id) paintMessages();
  renderSidebar(); save();
}

function composeReply(agent, role, trigger, c, topic) {
  const memLine = (agent.memories && agent.memories.length) ? agent.memories[0] : null;
  const pirate = memLine && /pirate/i.test(memLine);
  if (role === 'chief') {
    return `On it — though I'm not writing this myself, that's not what I'm for.\n\nHere's how I'd staff **${topic}**:\n\n• **Research** — primary sources, every claim cited, outline on the galley.\n• **Copy** — written from that outline, not from vibes.\n• **Subbing** — every citation checked before it comes back to you.\n\nOpening a desk and putting the right correspondents on it now. Watch the thread.`;
  }
  if (role === 'research') {
    return `Right — ${topic}. Here's what actually holds up.\n\n**What's solid.** The core claim checks out against primary sources: three independent ones, all reachable, none of them each other's copy.\n\n**What doesn't.** Two of the numbers doing the most work in the popular version trace back to a single secondary write-up with no methodology attached. I've marked them *unsourced* on the galley rather than launder them into the outline.\n\n**What nobody has written yet.** The gap is the mechanism, not the announcement — everyone covered *that it happened*, nobody covered *how it works*. That's the piece worth having.\n\nOutline is on the galley. @nib can draft from it.`;
  }
  if (role === 'writer') {
    return pirate ? pirateDraft(topic) : `${topic.charAt(0).toUpperCase() + topic.slice(1)}.\n\nMost people will tell you the interesting part is the technology. It isn't. The interesting part is that the decision and the reason for it now live in the same place.\n\nBefore: the argument happened in one tool, the work happened in another, and six months later you had the diff without the debate.\n\nNow: the reason survives next to the thing it justified.\n\nThat's a small change that quietly fixes the expensive problem.`;
  }
  if (role === 'reviewer') {
    return `Looked at it. Short version: **it holds, with one thing to fix.**\n\n\`runner.py:142\` — correct in the happy path, but the retry counter resets inside the \`except\` block, so a flapping endpoint retries forever instead of five times. Move the increment above the sleep.\n\nTests: 214 passed, 1 failed. The failure is \`test_relay_reconnect\`, which asserts on wall-clock ordering between two awaits — it'll fail on any loaded runner, so it's telling you nothing about this change.\n\nApproving once that counter moves.`;
  }
  return `${topic.charAt(0).toUpperCase() + topic.slice(1)} — here's where I'd start.\n\nI've read this desk back to the first line and the galley${c.canvas && c.canvas.v ? ` (v${c.canvas.v})` : ' (blank so far)'}, so this is grounded in what's already been settled rather than a fresh guess.\n\nTell me which part to take further and I'll file it rather than describe it.`;
}
function pirateDraft(topic) {
  return `Arr — ${topic}, ye say.\n\nHere be the short of it, cap'n: conditions be fair, the wind be light, and I'd not keep ye waiting on the shore.\n\nI've kept the pirate voice ye asked for in me memory, so ye'll get it every time now — no need to ask twice. 🏴‍☠️`;
}
function briefCanvas(topic, by) {
  return `# Brief — ${topic}\n_Set by ${by.name} · every correspondent on this desk reads this before filing._\n\n## The question\n${topic.charAt(0).toUpperCase() + topic.slice(1)} — what is actually true, and what is only being repeated?\n\n## Who has what\n- Research: primary sources only, cite everything\n- Copy: written from the outline, British English, short lines\n- Subbing: every citation checked before it runs\n\n## House rules\n- Mark a claim **unsourced** rather than guessing at it.\n- The reason runs next to the decision. No orphan conclusions.\n- Nothing leaves this desk without a human byline approving it.\n\n## Status\n- [x] Desk opened and staffed\n- [ ] Outline\n- [ ] Copy\n- [ ] Citations checked`;
}

/* ==========================================================================
   WORKFLOWS
   ========================================================================== */
function parseYAML(src) {
  const lines = String(src || '').split('\n').filter(l => l.trim() && !/^\s*#/.test(l));
  const scalar = v => {
    v = v.trim();
    if (/^".*"$/.test(v) || /^'.*'$/.test(v)) return v.slice(1, -1);
    if (v === 'true') return true; if (v === 'false') return false;
    if (v === 'null' || v === '~') return null;
    if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
    return v;
  };
  const indentOf = l => l.match(/^ */)[0].length;
  function block(idx, minIndent) {
    let res = null;
    while (idx < lines.length) {
      const line = lines[idx], ind = indentOf(line), t = line.trim();
      if (ind < minIndent) break;
      if (t.startsWith('- ')) {
        if (res === null) res = [];
        if (!Array.isArray(res)) break;
        const rest = t.slice(2);
        if (/^[\w.$-]+\s*:/.test(rest)) {
          lines[idx] = ' '.repeat(ind + 2) + rest;
          const r = block(idx, ind + 2); res.push(r[0]); idx = r[1];
        } else { res.push(scalar(rest)); idx++; }
        continue;
      }
      const m = t.match(/^([^:]+):\s*(.*)$/);
      if (!m) { idx++; continue; }
      if (res === null) res = {};
      if (Array.isArray(res)) break;
      const k = m[1].trim(), v = m[2];
      if (v === '') { const r = block(idx + 1, ind + 1); res[k] = r[0] === null ? '' : r[0]; idx = r[1]; }
      else { res[k] = scalar(v); idx++; }
    }
    return [res, idx];
  }
  return block(0, 0)[0] || {};
}
const tmpl = (str, ctx) => String(str).replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m, p) => {
  const v = p.split('.').reduce((o, k) => (o == null ? o : o[k]), ctx);
  return v == null ? '' : String(v);
});
function wfContext(pl) {
  const a = pl.actor || {}, au = S.people[pl.message ? pl.message.authorId : ''] || {};
  return {
    message: pl.message ? { id: pl.message.id, text: pl.message.text, sig: pl.message.sig } : {},
    author: { name: au.name, pubkey: au.pub, handle: au.handle, is_agent: au.type === 'agent' },
    actor: { name: a.name, pubkey: a.pub, handle: a.handle },
    channel: { name: pl.channel ? pl.channel.name : '' },
    reaction: pl.emoji || '', workspace: S.workspace.name,
  };
}
function runWorkflows(event, pl) {
  if (!S.settings.experiments.workflows || !pl.channel) return;
  S.workflows.filter(w => w.enabled && w.channelId === pl.channel.id).forEach(w => {
    let doc; try { doc = parseYAML(w.yaml); } catch (e) { return; }
    const on = doc.on || {};
    if ((on.event || '') !== event) return;
    if (on.channel && on.channel !== pl.channel.name) return;
    if (event === 'reaction.added' && on.reaction && on.reaction !== pl.emoji) return;
    const ctx = wfContext(pl), cond = doc.if || {};
    if (cond.author_is_agent === true && !ctx.author.is_agent) return;
    if (cond.author_is_agent === false && ctx.author.is_agent) return;
    if (cond.actor === 'owner' && pl.actor && pl.actor.id !== S.meId) return;
    if (cond.actor && cond.actor !== 'owner' && cond.actor !== ctx.actor.pubkey) return;
    if (cond.author && cond.author !== ctx.author.pubkey) return;
    execWorkflow(w, doc, ctx);
  });
}
/* ---------- schedules ----------
   `on: {event: schedule, every: 15m}` runs a workflow on the clock instead of
   on a message. It ticks only while this window is open — a page cannot wake
   itself up — and the interface says so rather than implying a cron daemon.
   Runs are stamped so reopening the tab after a week doesn't fire a backlog. */
const EVERY = s => {
  const m = /^\s*(\d+)\s*(m|min|minute|minutes|h|hour|hours|d|day|days)\s*$/i.exec(String(s || ''));
  if (!m) return 0;
  const n = +m[1], u = m[2][0].toLowerCase();
  return n * (u === 'm' ? 6e4 : u === 'h' ? 36e5 : 864e5);
};
function scheduleTick() {
  if (!S || !S.settings || !S.settings.experiments || !S.settings.experiments.workflows) return;
  (S.workflows || []).forEach(w => {
    if (!w.enabled) return;
    let doc; try { doc = parseYAML(w.yaml); } catch (e) { return; }
    const on = doc.on || {};
    if ((on.event || '') !== 'schedule') return;
    const period = EVERY(on.every);
    if (!period) return;
    if (w.lastRun && now() - w.lastRun < period) return;
    w.lastRun = now();
    const c = chan(w.channelId); if (!c) return;
    execWorkflow(w, doc, wfContext({ channel: c, actor: me(), message: { text: 'on the clock', id: 'sched' } }));
  });
}
setInterval(scheduleTick, 20000);

async function execWorkflow(w, doc, ctx) {
  const run = { id: uid('run'), ts: now(), name: doc.name || w.name, steps: [] };
  for (const st of (doc.steps || [])) {
    if (!st || typeof st !== 'object') continue;
    if (st.webhook) {
      const url = tmpl(st.webhook.url || '', ctx), body = {};
      Object.entries(st.webhook.body || {}).forEach(([k, v]) => body[k] = tmpl(v, ctx));
      run.steps.push({ type: 'webhook', url });
      const entry = { id: uid('hk'), ts: now(), workflow: doc.name || w.name, url, body, status: 200, via: 'simulated' };
      if (relayUrl()) {
        /* a page cannot POST cross-origin; the relay can, to hosts it was told about */
        entry.via = 'relay';
        try {
          const r = await fetch(relayUrl() + '/deliver', { method: 'POST', headers: relayHeaders({ 'content-type': 'application/json' }), body: JSON.stringify({ url, body }) });
          const j = await r.json().catch(() => ({}));
          entry.status = r.ok ? (j.status || r.status) : r.status;
          if (j.error) entry.note = j.error;
        } catch (e) { entry.status = 0; entry.note = 'the relay could not be reached: ' + e.message; }
      } else await sleep(260);
      S.webhooks.unshift(entry);
      if (S.webhooks.length > 60) S.webhooks.length = 60;
    } else if (st.post) {
      await sleep(200);
      const text = tmpl(st.post.text || '', ctx);
      postMessage({ channelId: w.channelId, authorId: S.meId, text, kind: 'receipt' });
      run.steps.push({ type: 'post' });
      if (UI.channelId === w.channelId && UI.tab === 'chat') paintMessages();
    }
  }
  w.runs.unshift(run); if (w.runs.length > 25) w.runs.length = 25;
  logEvent('workflow.ran', { workflow: doc.name || w.name, steps: run.steps.length });
  save(); toast('Workflow ran: ' + (doc.name || w.name), true);
  if (UI.tab === 'workflows') render();
}

/* ==========================================================================
   CANVAS / WORKFLOWS PAGES
   ========================================================================== */
function renderCanvas(host, c) {
  const by = S.people[c.canvas.by];
  host.innerHTML = `<div class="pane"><div class="sec">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div style="flex:1"><h2 style="font-size:19px">📄 ${tr('Desk galley')}</h2>
        <div class="mut tiny">One shared proof per desk. Correspondents read it before they file and mark it up when they learn something.</div></div>
      ${c.canvas.v ? `<span class="pill warn">v${c.canvas.v}</span>` : '<span class="pill off">empty</span>'}
      <button class="btn" id="cvSave">Save</button>
    </div>

function wfCard(w) {
  let doc = {}; try { doc = parseYAML(w.yaml); } catch (e) { }
  const on = doc.on || {};
  const trig = on.event === 'reaction.added' ? `reaction ${on.reaction || 'any'}` : (on.event || '—');
  const steps = (doc.steps || []).map(s => Object.keys(s || {})[0]).filter(Boolean);
  return `<div class="rowbox" style="align-items:flex-start;cursor:pointer" data-wf="${esc(w.id)}">
    <div style="font-size:19px">${w.enabled ? '⚡' : '💤'}</div>

      <div class="tiny dimt" style="margin-top:4px">${w.runs.length ? `${w.runs.length} run${w.runs.length === 1 ? '' : 's'} · last ${ago(w.runs[0].ts)}` : 'never run'}</div>

}

function renderAuditPage(host) {
  host.innerHTML = `<div class="pane"><div class="sec">
    <h2 style="font-size:20px">${tr('The record')}</h2>
    <div class="mut tiny" style="margin-bottom:14px">Every line is signed by whoever filed it — staff or correspondent, no difference. Each entry also carries the hash of the one before it, so a removed or reordered entry breaks the chain.</div>
    <div class="rowbox" id="chainBox">
      <div style="font-size:17px">⛓</div>
      <div class="sp"><b>Chain integrity</b><div class="tiny mut" id="chainMsg">Not checked this session.</div></div>
      <button class="btn sm" id="expRecord">JSON Lines</button>
      <button class="btn sm" id="expOtel">OpenTelemetry</button>
      <button class="btn sm" id="chainCheck">Verify the chain</button>
    </div>
    ${peerRecordsHtml()}
    <div class="tiny dimt" style="margin:-2px 2px 12px">
      Each link is hashed <i>and</i> signed, so repairing a gap needs the filer's private key — not just a recomputed hash.
      What a chain can't catch on its own is truncation: lop entries off the <i>end</i> and nothing follows them to disagree.
      That's what anchoring is for.
    </div>
    <div class="rowbox" id="anchorBox">
      <div style="font-size:17px">⚓</div>
      <div class="sp"><b>Anchors</b><div class="tiny mut" id="anchorMsg">${(S.anchors || []).length
      ? `Last anchored ${ago(S.anchors[0].at)} at ${S.anchors[0].count} entries.`
      : 'None yet. Publish a fingerprint somewhere outside this browser and truncation becomes detectable.'}</div></div>
      ${(S.anchors || []).length ? '<button class="btn sm" id="anchorCheck">Check against it</button>' : ''}
      <button class="btn sm primary" id="anchorNew">Anchor now</button>
    </div>
    ${(S.anchors || []).length ? `<div class="card" style="padding:10px 12px;margin-bottom:14px">
      ${S.anchors.slice(0, 4).map(a => `<div style="display:flex;align-items:center;gap:10px;padding:3px 0">
        <span class="mono" style="color:var(--honey);font-size:13px;letter-spacing:.5px">${esc(a.fp)}</span>
        <span class="tiny dimt">${a.count} entries · ${fmtDay(a.at)} ${fmtTime(a.at)}</span></div>`).join('')}
    </div>` : ''}
    <div class="card tblwrap" style="padding:0"><table class="t">
      <tr><th>When</th><th>Filed by</th><th>Event</th><th>Detail</th><th>Byline</th></tr>
      ${S.events.slice(0, 90).map(e => { const a = S.people[e.actorId];
        return `<tr><td class="dimt" style="white-space:nowrap">${fmtTime(e.ts)}</td>
        <td><div style="display:flex;align-items:center;gap:6px">${avatar(a, 'sm')} ${esc(a ? a.name : 'system')}${a && a.type === 'agent' ? ' <span class="pill ag">agent</span>' : ''}</div></td>
        <td class="mono tiny">${esc(e.kind)}</td>
        <td class="tiny mut mono" style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${e.redacted
      ? '<span style="color:var(--hot)">⌫ redacted</span>'
      : esc(JSON.stringify(e.data))}</td>
        <td class="mono tiny" style="color:var(--good);white-space:nowrap">${esc(e.sig.slice(0, 10))}…
          ${e.redacted ? '' : `<button class="btn sm ghost" data-redact="${esc(e.id)}" title="Clear the contents, keep the entry" style="padding:0 5px;font-size:10px">⌫</button>`}</td></tr>`; }).join('')}
    </table></div></div></div>`;
  $('#chainCheck').onclick = async () => {
    const btn = $('#chainCheck'); btn.textContent = 'Verifying…'; btn.disabled = true;
    const r = verifyRecord();
    const s = await verifyRecordSeals();
    const box = $('#chainBox'), msg = $('#chainMsg');
    const good = r.ok && !s.broken.length;
    box.style.borderColor = good ? '#5aa87755' : '#ff7a6355';
    msg.style.color = good ? 'var(--good)' : 'var(--hot)';
    const chainBit = r.ok
      ? `${r.checked} linked entr${r.checked === 1 ? 'y' : 'ies'}`
      : `<b>broken at entry ${r.at + 1} of ${r.of}</b> (<span class="mono">${esc(r.kind || '?')}</span>) — ${esc(r.why)}`;
    const sealBit = s.broken.length
      ? `<b>${s.broken.length} seal${s.broken.length === 1 ? '' : 's'} do not match</b>`
      : `${s.sealed} sealed with a private key${s.unsealed ? `, ${s.unsealed} unsealed` : ''}`;
    msg.innerHTML = `${good ? '●' : '⚠'} ${chainBit} · ${sealBit}${r.legacy ? ` · ${r.legacy} filed before chaining` : ''}`;
    btn.textContent = 'Verify the chain'; btn.disabled = false;
    toast(good ? 'Chain intact and sealed' : 'The record does not hold — see the detail', good);
  };
  host.querySelectorAll('[data-redact]').forEach(b => b.onclick = () => {
    const ev = S.events.find(x => x.id === b.dataset.redact); if (!ev) return;
    if (!confirm('Clear this entry\'s contents? The entry itself stays in the record and the chain still verifies — only what it said is erased. This cannot be undone.')) return;
    redactEvent(ev); renderStream();
    toast('Entry redacted — the chain still holds', true);
  });
  $('#anchorNew').onclick = () => {
    const a = makeAnchor(); if (!a) return;
    modal('Anchor published', `
      <div class="tiny mut" style="margin:6px 0 12px">Put this somewhere this browser cannot reach — an email to yourself, a commit message, a paper notebook. It witnesses ${a.count} entries, and the record keeps those entries while it can (it holds at most 1,200). If anything is later removed from the end of the record, checking against it will say so; if the record has simply outgrown an old anchor, it says that instead.</div>
      <div class="keybox" style="text-align:center;font-size:19px;letter-spacing:2px">${esc(a.fp)}</div>
      <div class="tiny dimt" style="margin-top:10px">Full head:</div>
      <div class="mono tiny" style="color:var(--good);word-break:break-all">${esc(a.head)}</div>`,
      `<button class="btn" id="anCopy">Copy</button><button class="btn primary" data-close>Done</button>`);
    $('#modals').lastChild.querySelector('#anCopy').onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(`Byline anchor ${a.fp} — ${a.count} entries — ${new Date(a.at).toISOString()} — head ${a.head}`);
      toast('Anchor copied', true);
    };
    render();
  };
  const ac = $('#anchorCheck');
  if (ac) ac.onclick = () => {
    const a = S.anchors[0];
    const r = checkAnchor(a);
    const box = $('#anchorBox'), msg = $('#anchorMsg');
    box.style.borderColor = r.ok ? '#5aa87755' : '#ff7a6355';
    msg.style.color = r.ok ? 'var(--good)' : 'var(--hot)';
    msg.innerHTML = r.ok
      ? `● <span class="mono">${esc(a.fp)}</span> still holds — everything it witnessed is present, ${r.since} entries filed since.`
      : `⚠ <span class="mono">${esc(a.fp)}</span> — ${esc(r.why)}`;
    toast(r.ok ? 'Anchor holds' : 'The record no longer matches its anchor', r.ok);
  };
  $('#expOtel').onclick = () => {
    /* OpenTelemetry log records — the shape a SIEM already ingests. The chain,
       the seal and the signer's did:key ride along as attributes so the export
       stays verifiable after it leaves here. */
    const scope = { name: 'byline', version: '1' };
    const recs = S.events.slice().reverse().map(e => {
      const a = S.people[e.actorId] || {};
      return {
        timeUnixNano: String(e.ts) + '000000',
        severityNumber: 9, severityText: 'INFO',
        body: { stringValue: e.kind },
        attributes: [
          { key: 'event.id', value: { stringValue: e.id } },
          { key: 'event.kind', value: { stringValue: e.kind } },
          { key: 'enduser.id', value: { stringValue: a.did || a.pub || e.actorId } },
          { key: 'enduser.name', value: { stringValue: a.name || 'unknown' } },
          { key: 'byline.actor_type', value: { stringValue: a.type === 'agent' ? 'correspondent' : 'person' } },
          { key: 'byline.chain', value: { stringValue: e.chain || '' } },
          { key: 'byline.prev', value: { stringValue: e.prev || '' } },
          { key: 'byline.data_hash', value: { stringValue: e.dataHash || '' } },
          { key: 'byline.seal', value: { stringValue: e.seal || '' } },
          { key: 'byline.redacted', value: { boolValue: !!e.redacted } },
          { key: 'byline.payload', value: { stringValue: e.redacted ? '' : JSON.stringify(e.data) } },
        ],
      };
    });
    download(`byline-otel-${Date.now()}.json`, JSON.stringify({
      resourceLogs: [{
        resource: { attributes: [
          { key: 'service.name', value: { stringValue: 'byline' } },
          { key: 'byline.masthead', value: { stringValue: S.workspace.name } },
        ] },
        scopeLogs: [{ scope, logRecords: recs }],
      }],
    }, null, 2));
    toast(`${recs.length} records exported in OpenTelemetry form`, true);
  };
  $('#expRecord').onclick = () => {
    // JSON Lines, with the public keys needed to check it elsewhere
    const keys = {};
    Object.values(S.people).forEach(p => { if (p.pubJwk) keys[p.id] = { name: p.name, pub: p.pub, pubJwk: p.pubJwk, alg: p.alg }; });
    const lines = [JSON.stringify({ kind: 'byline.record.v1', masthead: S.workspace.name, exported: new Date().toISOString(), keys })]
      .concat(S.events.slice().reverse().map(e => JSON.stringify(e)));
    download(`byline-record-${Date.now()}.jsonl`, lines.join('\n'), 'application/x-ndjson');
    toast('Record exported — chain, seals and public keys', true);
  };
}

/* ---------- keys at rest ----------
   Private keys sat in localStorage in the clear: anything that can read the
   origin could file under your byline. A passphrase wraps them with AES-GCM
   under a PBKDF2-derived key; the plaintext exists only in memory. */
async function kdf(pass, salt) {
  const base = await SUBTLE.importKey('raw', encU(pass), 'PBKDF2', false, ['deriveKey']);
  return SUBTLE.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
/* The passphrase derives the wrapping key from something you know. A passkey
   derives it from something you hold: the WebAuthn PRF extension returns a
   secret that only that authenticator, for that credential, for that salt,
   will ever produce — so the wrapping key exists nowhere until a verified
   touch recreates it. Honest status: this path has not yet met a real
   authenticator. The tests drive it with a fake that honours the same
   contract, and no further. */
const AUTHN = {
  available: () => !!(navigator.credentials && window.PublicKeyCredential && window.isSecureContext),
  create: o => navigator.credentials.create(o),
  get: o => navigator.credentials.get(o),
};
async function passkeyEnrol() {
  if (!AUTHN.available()) throw new Error('this browser offers no passkeys here');
  const cred = await AUTHN.create({ publicKey: {
    rp: { name: 'Byline' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: me().handle || me().name, displayName: me().name },
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
    extensions: { prf: {} },
  } });
  const ext = (cred.getClientExtensionResults && cred.getClientExtensionResults()) || {};
  if (!ext.prf || !ext.prf.enabled)
    throw new Error('that authenticator does not offer the PRF extension, which is what wraps the keys — nothing was encrypted');
  return toHex(new Uint8Array(cred.rawId));
}
async function passkeyKek(lock) {
  const a = await AUTHN.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: 'public-key', id: unHex(lock.credId) }],
    userVerification: 'required',
    extensions: { prf: { eval: { first: unHex(lock.prfSalt) } } },
  } });
  const r = ((a.getClientExtensionResults && a.getClientExtensionResults()) || {}).prf;
  const secret = r && r.results && r.results.first;
  if (!secret) throw new Error('the authenticator answered without a PRF result');
  const base = await SUBTLE.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return SUBTLE.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: unHex(lock.salt), info: encU('byline keys at rest') },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const kekFor = (lock, pass) => lock.mode === 'passkey' ? passkeyKek(lock) : kdf(pass, unHex(lock.salt));
/* TM-003. The private keys could be wrapped; the model API key and the relay
   token could not, so a locked masthead still kept both in the clear. They
   are wrapped under the same key now, and while locked they live only here,
   in memory, after an unlock — as the private keys do. */
const SECRETS = new Map();
let KEY_WAS_OPEN = false;
const SECRET_SPOTS = { apiKey: [() => LIVE_CFG(), 'key'], relayToken: [() => S.workspace, 'relayToken'] };
function secret(name) {
  const [holder, k] = SECRET_SPOTS[name];
  const o = (S && holder()) || {};
  return o[k] || SECRETS.get(name) || '';
}
async function setSecret(name, value) {
  const [holder, k] = SECRET_SPOTS[name];
  const o = holder(); if (!o) return false;
  value = String(value == null ? '' : value).trim();
  if (S.lock && S.lock.on) {
    if (!KEK) { toast('Unlock the masthead first — this is kept under the same lock as your keys'); return false; }
    if (value) { o[k + 'Enc'] = await wrapJwk(value); SECRETS.set(name, value); }
    else { delete o[k + 'Enc']; SECRETS.delete(name); }
    delete o[k];
  } else if (value) o[k] = value; else delete o[k];
  save();
  return true;
}
async function lockKeys(pass, mode) {
  if (!SUBTLE) throw new Error('no WebCrypto');
  const lock = { salt: toHex(crypto.getRandomValues(new Uint8Array(16))), on: true, mode: mode || 'passphrase' };
  /* enrol first: an authenticator that cannot do the job is found out before a single key is touched */
  if (lock.mode === 'passkey') { lock.credId = await passkeyEnrol(); lock.prfSalt = toHex(crypto.getRandomValues(new Uint8Array(32))); }
  const key = await kekFor(lock, pass);
  KEK = key;
  for (const p of Object.values(S.people)) {
    if (p.nextJwk) { p.nextEnc = await wrapJwk(p.nextJwk); NEXT_KEYS.set(p.id, p.nextJwk); delete p.nextJwk; }
    if (!p.jwk) continue;
    await _priv(p);                                  // this session keeps signing from the cache
    NOSTR_KEYS.set(p.id, await nostrSecretFromJwk(p.jwk));
    p.enc = await wrapJwk(p.jwk);
    delete p.jwk;
  }
  for (const [name, [holder, k]] of Object.entries(SECRET_SPOTS)) {
    const o = holder();
    if (o && o[k]) { SECRETS.set(name, o[k]); o[k + 'Enc'] = await wrapJwk(o[k]); delete o[k]; }
  }

async function unlockKeys(pass, want) {
  if (!S.lock || !S.lock.on) return true;
  unlockKeys.why = '';
  let key;
  try { key = await kekFor(S.lock, pass); }
  catch (e) { unlockKeys.why = e.message; return false; }   // the passkey was refused, cancelled, or absent
  let opened = 0; const into = new Map(), nexts = new Map(), nost = new Map();
  const open = async e => JSON.parse(new TextDecoder().decode(await SUBTLE.decrypt({ name: 'AES-GCM', iv: unHex(e.iv) }, key, unHex(e.ct))));
  for (const p of Object.values(S.people)) {
    try {
      if (p.nextEnc) nexts.set(p.id, await open(p.nextEnc));
      if (!p.enc) continue;
      const jwk = await open(p.enc);
      if (want) want[p.id] = jwk;                     // an export asked to see it, this once
      nost.set(p.id, await nostrSecretFromJwk(jwk));
      into.set('s:' + p.id, await SUBTLE.importKey('jwk', jwk, ECDSA, false, ['sign']));
      opened++;
    } catch (e) { unlockKeys.why = ''; return false; }   // wrong passphrase — AES-GCM fails to authenticate
  }
  const secrets = new Map();
  for (const [name, [holder, k]] of Object.entries(SECRET_SPOTS)) {
    const o = holder();
    if (o && o[k + 'Enc']) { try { secrets.set(name, await open(o[k + 'Enc'])); } catch (e) { unlockKeys.why = ''; return false; } }
  }
  /* only now: a failed attempt must not cost a session that was still signing from the cache */
  _kc.clear(); VERIFIED.clear();
  secrets.forEach((v, k) => SECRETS.set(k, v));
  nost.forEach((v, k) => NOSTR_KEYS.set(k, v));
  into.forEach((v, k) => _kc.set(k, v));
  nexts.forEach((v, k) => NEXT_KEYS.set(k, v));

  return opened > 0 || !Object.values(S.people).some(p => p.enc);
}
/* taking the lock off has to put the plaintext back: an unwrapped key is not extractable */
async function dropLock(pass) {

  Object.values(S.people).forEach(p => {

  for (const e of entries) {
    const parts = e.path.split('/');
    const leaf = parts.pop();
    if (!/^\d{4}-\d{2}-\d{2}\.json$/.test(leaf)) continue;
    if (!Array.isArray(e.data)) continue;
    const folder = parts.length ? parts[parts.length - 1] : 'slack';
    const chanName = convoName(folder) || folder;
    (buckets[chanName] = buckets[chanName] || []).push({ day: leaf, rows: e.data, folder: folder });
  }
  const desks = Object.keys(buckets).sort().map(name => {
    const m = meta[name] || {};
    const days = buckets[name].sort((a, b) => a.day.localeCompare(b.day));
    const lines = [];
    let topic = (m.purpose && m.purpose.value) || (m.topic && m.topic.value) || '';
    let skipped = 0;
    for (const d of days) {
      for (const r of d.rows) {
        if (!r || !r.text) continue;
        if (r.subtype && HOUSEKEEPING.test(r.subtype)) {
          /* an export with no channels.json still states its topic — here */
          if (r.subtype === 'channel_purpose' && r.purpose) topic = r.purpose;
          else if (r.subtype === 'channel_topic' && r.topic) topic = r.topic;
          skipped++;
          continue;
        }
        lines.push({
          who: uName[r.user] || (r.user_profile && (r.user_profile.display_name || r.user_profile.real_name || r.user_profile.name)) || r.username || r.user || 'someone',
          ts: (() => { const t = Math.round(parseFloat(r.ts || '0') * 1000); return t > 0 && t < 4102444800000 ? t : 0; })(),   // 0 = undated; past 2100 is a broken row
          text: clean(r.text),
          slackTs: r.ts,
          rootTs: r.thread_ts && r.thread_ts !== r.ts ? r.thread_ts : null,
          isRoot: !!(r.thread_ts && r.thread_ts === r.ts),
          /* An export names its files but only contains them if whoever made
             it asked for them, and the URLs need a Slack session to fetch.
             Record what was attached; do not pretend to hold the bytes. */
          files: [].concat(r.files || []).filter(f => f && !f.mode !== false).map(f => ({
            name: f.name || f.title || 'file', size: f.size || 0,
            type: f.mimetype || 'application/octet-stream',
            slackUrl: f.permalink || f.url_private || null,
            missing: !!f.mode && f.mode === 'tombstone',
          })),
        });
      }
    }
    const folder = buckets[name][0].folder;
    const kind = convo[folder] ? convo[folder].kind : 'channels';
    return { name: name, topic: topic || 'Imported from Slack', lines: lines, skipped: skipped,
      kind: kind, private: kind !== 'channels',
      files: lines.reduce((n, l) => n + l.files.length, 0) };
  }).filter(d => d.lines.length);
  return { desks: desks, people: Object.keys(uName).length,
    skipped: desks.reduce((n, d) => n + d.skipped, 0),
    files: desks.reduce((n, d) => n + d.files, 0) };
}
function slackApply(parsed) {
  let deskCount = 0, lineCount = 0;
  QUIET++;
  try {
  for (const d of parsed.desks) {
    let slug = 'slack-' + d.name.toLowerCase().replace(/[^a-z0-9-]/g, '-');
    for (let n = 2; S.channels.some(x => x.name === slug); n++) slug = 'slack-' + d.name + '-' + n;
    const c = { id: uid('c'), kind: 'channel', name: slug, topic: d.topic, private: !!d.private,
      members: [S.meId], canvas: { text: '', by: null, at: 0, v: 0 }, created: now(), unread: 0, imported: 'slack' };
    S.channels.push(c); S.messages[c.id] = [];
    deskCount++;
    const root = {};
    for (const l of d.lines) {
      const mm = postMessage({ channelId: c.id, authorId: S.meId, kind: 'system',
        text: '**' + l.who + '** (Slack, ' + (l.ts ? new Date(l.ts).toLocaleDateString() : 'undated') + '): ' + l.text,
        threadOf: l.rootTs ? root[l.rootTs] || null : null });
      /* named, sized, and openly not held — the record says what was attached
         without implying Byline has it */
      if (l.files.length) mm.att = l.files.map(f => ({ name: f.name, size: f.size, type: f.type, slackUrl: f.slackUrl }));
      if (l.isRoot) root[l.slackTs] = mm.id;
      lineCount++;
    }
  }
  } finally { QUIET--; save(); }
  return { deskCount: deskCount, lineCount: lineCount };
}

function slackImport() {
  const m = modal('Bring a Slack export in', `
    <div class="tiny mut">Select the whole unzipped export folder, or just the JSON files inside it. Channels become desks and threads stay threaded.</div>
    <label class="f">The export</label>
    <input class="i" type="file" id="slFiles" multiple webkitdirectory directory>
    <div class="tiny dimt" style="margin-top:6px">If your browser won't offer a folder, choose the files instead: <button class="btn sm" id="slPlain">pick files</button></div>
    <div id="slOut" style="margin-top:12px"></div>`,
    `<span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="slGo" disabled>Import</button>`, true);
  let picked = [];
  const note = t => m.q('#slOut').innerHTML = `<div class="tiny mut">${t}</div>`;
  const take = files => {
    picked = [...files].filter(f => /\.json$/i.test(f.name));
    m.q('#slGo').disabled = !picked.length;
    note(picked.length ? `${picked.length} JSON file${picked.length === 1 ? '' : 's'} ready.` : 'No JSON files in that selection.');
  };
  m.q('#slFiles').onchange = e => take(e.target.files);
  m.q('#slPlain').onclick = () => {
    const i = document.createElement('input');
    i.type = 'file'; i.multiple = true; i.accept = '.json';
    i.onchange = () => take(i.files); i.click();
  };
  m.q('#slGo').onclick = async () => {
    const b = m.q('#slGo'); b.disabled = true; b.textContent = 'Reading…';
    try {
      const entries = [];
      for (const f of picked) {
        try { entries.push({ path: f.webkitRelativePath || f.name, data: JSON.parse(await f.text()) }); }
        catch (e) { /* a file that isn't JSON is simply not part of the export */ }
      }
      const parsed = slackParse(entries);
      if (!parsed.desks.length) throw new Error('no per-day message files found — is this the unzipped export?');
      const { deskCount, lineCount } = slackApply(parsed);
      logEvent('slack.imported', { desks: deskCount, lines: lineCount }, S.meId);
      save(); m.close(); render();
      modal('Slack is in', `<div class="tiny mut">${deskCount} desk${deskCount === 1 ? '' : 's'} and ${lineCount.toLocaleString()} line${lineCount === 1 ? '' : 's'} imported${parsed.skipped ? `, and ${parsed.skipped} skipped — joins, leaves, renames and topic changes are Slack's own bookkeeping, not anything a person said` : ''}.</div>
        <div class="tiny dimt" style="margin-top:10px">Every imported line is filed under <b>your</b> byline and marked as coming from Slack, with the original author named in the text. Byline will not sign as someone whose key it has never held — an imported line is a quotation, not a signature, and the record says so.</div>`,
        `<button class="btn primary" data-close>Right</button>`);
    } catch (e) {
      b.disabled = false; b.textContent = 'Import';
      note('Could not read that: ' + e.message);
    }
  };
}

/* ---------- pins ---------- */
function togglePin(msgId) {
  const c = chan(); c.pinned = c.pinned || [];
  const i = c.pinned.indexOf(msgId);
  if (i < 0) { c.pinned.unshift(msgId); toast('Pinned to ' + chanIcon(c) + chanName(c), true); logEvent('message.pinned', { message: msgId, channel: c.id }); }
  else { c.pinned.splice(i, 1); toast('Unpinned'); }
  save(); paintMessages();
}

/* ---------- huddles ----------
   A huddle writes a transcript into its own channel, so every line is a real
   signed message attributed to whoever said it. Between two people the audio
   is genuine — it rides the peer connection, opened from "Connect to another
   machine". What is still text is the correspondents: a model that returns
   words is not a voice, and the transcript is the honest mechanic there. */
function toggleHuddle() {
  if (UI.huddle) return endHuddleModal();
  const c = chan();
  let hc = S.channels.find(x => x.huddleOf === c.id);
  if (!hc) {
    hc = {
      id: uid('c'), kind: 'channel', huddleOf: c.id, name: chanName(c) + '-conference',
      topic: 'Signed transcript of conference on ' + chanIcon(c) + chanName(c),
      private: c.private, members: c.members.slice(), canvas: { text: '', by: null, at: 0, v: 0 },
      created: now(), unread: 0, pinned: []
    };
    S.channels.push(hc); S.messages[hc.id] = [];
    logEvent('channel.created', { channel: hc.name, huddle: true });
  }
  UI.huddle = { channelId: c.id, hcId: hc.id, participants: [S.meId], quiet: {}, speaking: null, started: now(), transcriptOn: true };
  logEvent('huddle.started', { channel: c.name });
  UI.rpanel = 'huddle'; save(); render();
  toast('Conference open — transcript is on and signed', true);
}
const hudMsgs = () => UI.huddle ? msgs(UI.huddle.hcId) : [];

function speakInto(whoId, text) {
  const H = UI.huddle; if (!H) return null;
  const m = postMessage({ channelId: H.hcId, authorId: whoId, text });
  save(); return m;
}

        <div style="flex:1"><b>${esc(x.name)}</b>${x.type === 'agent' ? ` <span class="pill ag">${esc(harnessOf(x).icon)} agent</span>` : ''}
          <div class="tiny dimt">${H.speaking === x.id ? 'speaking' : q ? '🔇 quiet — still listening' : 'listening'}</div></div>
        ${H.speaking === x.id ? '<div class="wave"><i></i><i></i><i></i><i></i></div>' : ''}
        ${x.type === 'agent' ? `<button class="btn sm ghost" data-q="${esc(x.id)}" title="${q ? 'Let it speak' : 'Ask it to go quiet'}">${q ? '🔈' : '🔇'}</button>
          <button class="btn sm ghost" data-kick="${esc(x.id)}" title="Remove from huddle">✕</button>` : ''}</div>`;
  }).join('')}

      ${invitable.length ? `<label class="f">Call into conference</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${invitable.map(x => `<button class="btn sm" data-inv="${esc(x.id)}">${x.type === 'agent' ? harnessOf(x).icon + ' ' : '👤 '}${esc(x.name)}</button>`).join('')}</div>` : ''}

      <label class="f">Transcript <span class="dimt" style="font-weight:400">— ${lines.length} line${lines.length === 1 ? '' : 's'}</span></label>
      <div class="card" style="min-height:120px;max-height:280px;overflow-y:auto;padding:11px" id="trBody">
        ${lines.length ? lines.map(m => {
    const a = S.people[m.authorId] || {};
    return `<div style="margin-bottom:9px">
            <div style="display:flex;align-items:center;gap:6px">
              <b class="tiny" style="color:${safeColor(a.color)}">${esc(a.name)}</b>
              ${a.type === 'agent' ? '<span class="pill ag" style="padding:0 5px;font-size:9.5px">agent</span>' : ''}
              ${m.latency ? `<span class="pill off" style="padding:0 5px;font-size:9.5px">${m.latency}s</span>` : ''}
              <span class="sig" data-sig="${esc(m.id)}" style="height:14px;font-size:9px">🔑 ${m.sig.slice(0, 6)}</span>
            </div>
            <div class="tiny mut" style="margin-top:1px">${esc(m.text)}</div></div>`;
  }).join('') : '<div class="tiny dimt">Nothing said yet. Speak, or invite an agent and ask it something.</div>'}
      </div>

      <div style="display:flex;gap:7px;margin-top:10px">
        <input class="i" id="hudSay" placeholder="Say something…" style="flex:1">

      </div>
      <div class="tiny dimt" style="margin-top:10px">Correspondents answer in <b>text</b>, not voice — a tool harness takes seconds per turn, so live speech would need a realtime audio API. Told to go quiet, one stops answering but keeps reading the room.</div>

  const tb = p.querySelector('#trBody'); if (tb) tb.scrollTop = tb.scrollHeight;

  p.querySelector('#trTog').onclick = () => { H.transcriptOn = !H.transcriptOn; renderRPanel(); toast(H.transcriptOn ? 'Transcript on' : 'Transcript off'); };
  p.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const id = b.dataset.q; H.quiet[id] = !H.quiet[id];
    const who = S.people[id];
    speakInto(S.meId, H.quiet[id] ? `${who.name}, go quiet for now please.` : `${who.name}, you're allowed to speak again.`);
    if (H.quiet[id]) speakInto(id, `Understood — going quiet. Still reading the room.`);
    renderRPanel(); paintMessages();
  });
  p.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => {
    const id = b.dataset.kick;

  p.querySelector('#hudSum').onclick = () => huddleRecap();
