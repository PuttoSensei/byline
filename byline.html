  p.querySelectorAll('[data-sig]').forEach(b => b.onclick = () => sigModal(b.dataset.sig));
}

async function inviteToHuddle(id) {
  const H = UI.huddle, who = S.people[id];
  H.participants.push(id); renderRPanel();
  logEvent('huddle.joined', { who: who.name }, id);
  if (who.type !== 'agent') return;
  await sleep(700);
  H.speaking = id; renderRPanel();
  await sleep(900);
  const m = speakInto(id, `${who.name} here, ${me().name} — online in this channel and listening. What do you need?`);
  if (m) m.latency = 4 + Math.floor(Math.random() * 6);
  renderRPanel(); paintMessages();
  await sleep(1200); H.speaking = null; renderRPanel();
}

async function huddleSay(text) {
  const H = UI.huddle;
  H.speaking = S.meId; speakInto(S.meId, text); renderRPanel(); paintMessages();
  await sleep(600); H.speaking = null; renderRPanel();

  // spoken commands: "<name>, be quiet" / "<name>, you can speak"
  const inRoom = H.participants.map(x => S.people[x]).filter(x => x && x.type === 'agent');
  const named = inRoom.filter(a => new RegExp('\\b' + a.name + '\\b', 'i').test(text));
  if (/\b(be quiet|go quiet|stay quiet|don'?t respond|stop responding|quiet please)\b/i.test(text)) {
    (named.length ? named : inRoom).forEach(a => H.quiet[a.id] = true);
    for (const a of (named.length ? named : inRoom)) { speakInto(a.id, 'Understood — going quiet. Still reading the room.'); }
    renderRPanel(); paintMessages(); return;
  }
  if (/\b(you'?re allowed to speak|you can speak|speak again|unmute)\b/i.test(text)) {
    (named.length ? named : inRoom).forEach(a => H.quiet[a.id] = false);
    renderRPanel(); paintMessages(); return;
  }
  if (/\b(summari[sz]e|recap|wrap up)\b/i.test(text)) return huddleRecap(named[0]);

  const speaker = (named.length ? named : inRoom).find(a => !H.quiet[a.id]);
  if (!speaker) return;
  await sleep(500);
  H.speaking = speaker.id; renderRPanel();
  const lat = 8 + Math.floor(Math.random() * 22);
  await sleep(1400);
  const m = speakInto(speaker.id, huddleAnswer(speaker, text));
  if (m) m.latency = lat;
  renderRPanel(); paintMessages();
  await sleep(1300); H.speaking = null; renderRPanel();
}

async function huddleRecap(agent) {
  const H = UI.huddle;
  const who = agent || H.participants.map(x => S.people[x]).find(x => x && x.type === 'agent');
  if (!who) return toast('Invite an agent to the huddle first');
  H.speaking = who.id; renderRPanel();
  await sleep(1600);
  const lines = hudMsgs().filter(m => (S.people[m.authorId] || {}).type === 'human');
  const people = [...new Set(H.participants.map(x => (S.people[x] || {}).name))].filter(Boolean);
  const text = `Recap of the last ${Math.max(1, Math.floor((now() - H.started) / 60000))} minutes.

1. In the room: ${people.join(', ')} — ${H.participants.filter(x => (S.people[x] || {}).type === 'agent').length} of those are agents.
2. ${lines.length} spoken line${lines.length === 1 ? '' : 's'} captured, each carrying the speaker's byline. That is the difference from an ordinary call recording — you can prove who said what.
3. Between people the audio is real, carried over the direct connection with nothing in between. Correspondents still answer over text: each turn runs the full harness — tools plus model — so replies lag by tens of seconds.
4. Bottom line: two humans can talk while the correspondents take notes. What is still missing is a correspondent that speaks, and that needs a realtime audio model rather than better prompting.`;
  const m = speakInto(who.id, text);
  if (m) m.latency = 12 + Math.floor(Math.random() * 14);
  renderRPanel(); paintMessages();
  await sleep(1200); H.speaking = null; renderRPanel();
  return m;
}

function kickRoast(a) {
  return `I am not slow, I am thorough. Remove me and you lose the agent that can both roast and ship.\n\nI'll see myself out. ${a && /grok/i.test(a.name) ? '' : '🫡'}`;
}

function endHuddleModal() {
  const H = UI.huddle; if (!H) return;
  const m = modal('End conference', `
    <div class="tiny mut" style="margin:6px 0 12px">The transcript stays in <b>${esc(chanName(chan(H.hcId)))}</b> — signed, line by line.</div>
    <div class="rowbox"><div class="sp"><b>File a recap to ${chanIcon(chan(H.channelId))}${esc(chanName(chan(H.channelId)))}</b>
      <div class="tiny mut">A correspondent writes the wrap and it runs on the front page, so whoever missed it sees it first.</div></div>
      <button class="sw on" id="recTog"></button></div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="endGo">End conference</button>`);
  let rec = true;
  m.q('#recTog').onclick = () => { rec = !rec; m.q('#recTog').classList.toggle('on', rec); };
  m.q('#endGo').onclick = async () => {
    m.close();
    const parent = chan(H.channelId), agent = H.participants.map(x => S.people[x]).find(x => x && x.type === 'agent');
    if (rec && agent) {
      const r = await huddleRecap(agent);
      const post = postMessage({
        channelId: parent.id, authorId: agent.id,
        text: `🎧 **Conference wrap** — ${new Date(H.started).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}, ${H.participants.length} in the room.\n\n${r ? r.text.split('\n').slice(2).join('\n') : ''}\n\nFull signed transcript: **${chanName(chan(H.hcId))}**`
      });
      parent.pinned = parent.pinned || []; parent.pinned.unshift(post.id);
      logEvent('message.pinned', { message: post.id, channel: parent.id }, agent.id);
    }
    logEvent('huddle.ended', { channel: parent.name, lines: hudMsgs().length });
    UI.huddle = null; UI.rpanel = null; save(); render();
    toast(rec && agent ? 'Conference closed — wrap is on the front page' : 'Conference closed', true);
  };
}

function huddleAnswer(a, q) {
  const t = topicOf(q);
  const mem = (a.memories || [])[0];
  if (mem && /pirate/i.test(mem)) return `Arr — ${t}, ye say. Short answer: aye. Longer answer's in the channel where it'll survive the call. 🏴‍☠️`;
  if (/\?$/.test(q.trim())) return `Short answer on ${t}: yes — and the reasoning is on the channel canvas so it outlives this call. Want me to post the long version so it's on the record?`;
  return `Noted. I'll take ${t} and put the result in the channel rather than leave it trapped in a voice call nobody can search.`;
}

/* ==========================================================================
   MODALS
   ========================================================================== */
/* A dialog has to be announced, hold focus while it's open, and give focus back
   when it closes — otherwise a keyboard or screen-reader user is stranded
   behind it with no way to tell it exists. */
let modalSeq = 0;
/* axe found six toggle switches a screen reader announces as "button", and
   inputs whose <label class="f"> never carried a `for`. Rather than chase ten
   template strings, every paint gives switches a role, a state and the name of
   the row they sit in, and ties each label to the control that follows it. */
function a11yDecorate(root) {
  const R = root || document;
  R.querySelectorAll('button.sw').forEach(b => {
    b.setAttribute('role', 'switch');
    b.setAttribute('aria-checked', b.classList.contains('on') ? 'true' : 'false');
    if (!b.getAttribute('aria-label')) {
      const known = { liveTog: 'Use a live model', gwTog: 'Use the gateway', shareTog: 'Share this desk', notifyTog: 'Tell me when I am mentioned',
        trTog: 'Keep a transcript', recTog: 'File a recap when the conference ends', nPriv: 'Make this desk private', obSelf: 'Use a relay', bylinesTog: 'A byline on every line' };
      const byData = b.dataset.wftog ? 'Enable this wire rule' : b.dataset.ex ? 'Turn on the ' + b.dataset.ex + ' experiment' : null;
      const row = b.closest('.rowbox, .card'); const t = row && row.querySelector('b, h3, .h');
      b.setAttribute('aria-label', known[b.id] || byData || (t ? t.textContent.trim() : 'toggle'));
    }
  });
  R.querySelectorAll('label.f').forEach(l => {
    if (l.getAttribute('for')) return;
    let n = l.nextElementSibling;
    while (n && !/^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName)) { const inner = n.querySelector && n.querySelector('input,select,textarea'); if (inner) { n = inner; break; } n = n.nextElementSibling; }
    if (!n || n.closest('label')) return;
    if (!n.id) n.id = 'f_' + Math.random().toString(36).slice(2, 8);
    l.setAttribute('for', n.id);
  });
  R.querySelectorAll('input.i:not([aria-label]), select.i:not([aria-label]), textarea.i:not([aria-label])').forEach(el => {
    if (el.id && R.querySelector('label[for="' + el.id + '"]')) return;
    const ph = el.getAttribute('placeholder'); if (ph) el.setAttribute('aria-label', ph);
  });
}

function modal(title, bodyHTML, footerHTML, wide) {
  const id = 'mdl' + (++modalSeq);
  const returnTo = document.activeElement;
  const scrim = el('div', 'scrim');
  scrim.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${esc(id)}">
    <div class="mh"><h3 id="${esc(id)}">${title}</h3><button class="iconbtn" data-close aria-label="Close">✕</button></div>
    <div class="mc">${bodyHTML}</div>${footerHTML ? `<div class="mf">${footerHTML}</div>` : ''}</div>`;
  $('#modals').appendChild(scrim);
  a11yDecorate(scrim);

  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const close = () => {
    scrim.remove();
    document.removeEventListener('keydown', onKey);
    if (returnTo && returnTo.focus) returnTo.focus();     // hand focus back where it came from
  };
  const onKey = e => {
    if (e.key === 'Escape') return close();
    if (e.key !== 'Tab') return;
    const f = [...scrim.querySelectorAll(FOCUSABLE)].filter(n => n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  scrim.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  scrim.onclick = e => { if (e.target === scrim) close(); };
  document.addEventListener('keydown', onKey);
  setTimeout(() => {
    const f = scrim.querySelector('input,textarea,select') || scrim.querySelector(FOCUSABLE);
    if (f) f.focus();
  }, 30);
  return { scrim, close, q: s => scrim.querySelector(s) };
}

function dmBetween(a, b) {
  return S.channels.find(x => x.kind === 'dm' && x.members.length === 2
    && x.members.indexOf(a) >= 0 && x.members.indexOf(b) >= 0);
}
function openDM(personId) {
  let c = dmBetween(S.meId, personId);
  if (!c) {
    c = { id: uid('c'), kind: 'dm', name: 'dm', private: true, members: [S.meId, personId], canvas: { text: '', by: null, at: 0, v: 0 }, created: now(), unread: 0 };
    S.channels.push(c); S.messages[c.id] = [];
    logEvent('dm.opened', { with: personId });
  }
  save(); openChannel(c.id);
}
/* Two correspondents talking to each other without a person in the room. You
   can read it — it is your masthead — but you are not a member, and the record
   makes clear it happened out of your sight rather than in front of you. */
function agentDM(from, to, text) {
  if (from.id === to.id) return null;
  let c = dmBetween(from.id, to.id);
  if (!c) {
    c = { id: uid('c'), kind: 'dm', name: 'dm', private: true, members: [from.id, to.id],
      canvas: { text: '', by: null, at: 0, v: 0 }, created: now(), unread: 0, betweenAgents: true };
    S.channels.push(c); S.messages[c.id] = [];
    logEvent('dm.opened', { between: [from.name, to.name] }, from.id);
  }
  const m = postMessage({ channelId: c.id, authorId: from.id, text: text });
  if (UI.channelId === c.id) paintMessages();
  renderSidebar();
  return m;
}
/* A correspondent that says "ask <name> about X" hands the question over
   itself rather than making you carry it. */
async function relayToPeer(agent, c, trigger) {
  const m = /\b(?:ask|check with|hand (?:this|it) to|pass (?:this|it) to)\s+@?([a-z0-9_-]{2,20})\b/i.exec(trigger.text || '');
  if (!m) return false;
  const to = agents().find(a => a.handle === m[1].toLowerCase() && a.id !== agent.id && !a.offline);
  if (!to) return false;
  if (!(await mayDo(agent, 'delegate'))) return false;
  const dm = agentDM(agent, to, `${me().name} asked me about **${(trigger.text || '').slice(0, 90)}** — that's closer to your beat than mine. What have you got?`);
  if (!dm) return false;
  logEvent('agent.relayed', { from: agent.name, to: to.name }, agent.id);
  await sleep(700);
  agentDM(to, agent, composeReply(to, roleOf(to), trigger, c, topicOf(trigger.text || '')) .slice(0, 400));
  save();
  return true;
}

/* Reads a credential back the way a verifier would — proof first, then the
   claims, then whether it actually holds. */
function vcModal(vc, title) {
  const m = modal(esc(title || 'Credential'), `<div id="vcv" class="tiny dimt">Checking the proof…</div>
    <pre class="keybox mono" style="margin-top:10px;max-height:44vh;overflow:auto;white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(vc, null, 2))}</pre>`,
    `<button class="btn" id="vcDl">Save it</button><button class="btn" id="vcJwt">As a JWT</button><button class="btn" id="vcRdfc" title="ecdsa-rdfc-2019: the same claims, canonicalised as a graph — what most Data Integrity verifiers expect">As rdfc-2019</button><button class="btn" id="vcSd">Share only some of it</button>
     <span style="flex:1"></span><button class="btn primary" data-close>Close</button>`, true);
  m.q('#vcDl').onclick = () => download('byline-credential.jsonld', JSON.stringify(vc, null, 2), 'application/ld+json');
  m.q('#vcJwt').onclick = async () => {
    try {
      const iss = Object.values(S.people).find(p => p.did === vc.issuer) || me();
      const jwt = await vcToJwt(vc, iss);
      const r = await verifyJwtVc(jwt);
      modal('The same credential, as a JWT', `
        <div class="tiny mut">Identical claims, identical curve — a JOSE envelope instead of a Data Integrity proof, for anything that reads <span class="mono">application/vc+jwt</span>.</div>
        <div class="tiny" style="margin-top:9px;color:${r.ok ? 'var(--good)' : 'var(--press)'}">${r.ok ? '● verifies' : '✕ ' + esc(r.why)}</div>
        <pre class="keybox mono" style="margin-top:9px;max-height:30vh;overflow:auto;white-space:pre-wrap;font-size:11px">${esc(jwt)}</pre>`,
        `<button class="btn" id="jDl">Save it</button><span style="flex:1"></span><button class="btn primary" data-close>Close</button>`, true)
        .q('#jDl').onclick = () => download('byline-credential.jwt', jwt, 'application/vc+jwt');
    } catch (e) { toast('Could not convert: ' + e.message); }
  };
  m.q('#vcRdfc').onclick = async () => {
    try {
      const iss = Object.values(S.people).find(p => p.did === vc.issuer) || me();
      const bare = Object.assign({}, vc, { '@context': VC_CTX_RDFC }); delete bare.proof;
      const re = await issueVC(bare, iss, { cryptosuite: 'ecdsa-rdfc-2019' });
      const r = await verifyVC(re);
      modal('The same credential, under ecdsa-rdfc-2019', `
        <div class="tiny mut">The claims are read as JSON-LD, turned into RDF, and canonicalised as a graph (RDFC-1.0) before signing. Its second context gives Byline's own terms a home; without it a strict verifier refuses the document rather than guessing.</div>
        <div class="tiny" style="margin-top:9px;color:${r.ok ? 'var(--good)' : 'var(--press)'}">${r.ok ? '● verifies' : '✕ ' + esc(r.why)}</div>
        <pre class="keybox mono" style="margin-top:9px;max-height:30vh;overflow:auto;white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(re, null, 2))}</pre>`,
        `<button class="btn" id="rDl">Save it</button><span style="flex:1"></span><button class="btn primary" data-close>Close</button>`, true)
        .q('#rDl').onclick = () => download('byline-credential-rdfc.jsonld', JSON.stringify(re, null, 2), 'application/ld+json');
    } catch (e) { toast('Could not re-sign: ' + e.message); }
  };
  m.q('#vcSd').onclick = () => selectiveModal(vc);
  (async () => {
    const r = isDelegation(vc) ? await verifyDelegation(vc) : await verifyVC(vc);
    const box = m.q('#vcv'); if (!box) return;
    box.innerHTML = r.ok
      ? `<span style="color:var(--good)">● the proof holds${r.root ? ', rooted in ' + esc(r.root) : ''}${r.issuer ? ' — issued by ' + esc(r.issuer) : ''}</span>${r.note ? `<div style="color:var(--honey);margin-top:4px">${esc(r.note)}</div>` : ''}`
      : `<span style="color:var(--press)">✕ ${esc(r.why)}</span>`;
  })();
}

      meta: { type_values: [['VerifiableCredential', 'BylineDelegationCredential']] },

               { path: ['credentialSubject', 'authorisedByName'] }] }] } },
  correspondent: { label: 'Proof someone is a correspondent, and on what beat',

const CLAIM_WORDS = { id: 'its identifier', name: 'its name', handle: 'its handle', role: 'its role',
  scope: 'what it may do', authorisedBy: 'who authorised it', authorisedByName: 'who authorised it',
  masthead: 'which masthead', harness: 'which harness it runs on', policy: 'how it files',
  audience: 'which masthead the credential is for', validUntil: 'when it expires' };
const claimLabel = path => { const leaf = path[path.length - 1]; return CLAIM_WORDS[leaf] || path.join('.'); };

        <div class="tiny mut">${[].concat(a.query.claims || []).map(c => claimLabel([].concat(c.path))).join(', ') || 'the whole credential'}</div>
        ${a.matches.length ? a.matches.map((h, i) => `<div class="rowbox" style="cursor:pointer;${picks[a.query.id] === h ? 'border-color:rgba(232,65,47,.4)' : ''}${h.valid ? '' : ';opacity:.55'}" data-pick="${esc(a.query.id)}|${i}">
            <div style="width:20px;text-align:center">${picks[a.query.id] === h ? '✓' : '·'}</div>

        const { credential, disclosures } = await makeSelective(vc, hide);
        const jwt = await vcToJwt(credential, iss);
        /* hand over only the disclosures for the claims that were ticked */
        const wanted = [];
        for (const k of keys.filter(k => show.has(k))) {
          for (const d of disclosures) {
            const [, name] = JSON.parse(new TextDecoder().decode(unb64u(d)));
            if (name === k) wanted.push(d);
          }
        }
        const combined = packSd(jwt, wanted);
        const r = await verifySelective(combined);
        m.q('#sdOut').innerHTML = `<div class="rowbox" style="display:block;padding:11px;border-color:${r.ok ? 'rgba(90,168,119,.45)' : 'rgba(232,65,47,.5)'}">
          <b style="color:${r.ok ? 'var(--good)' : 'var(--press)'}">${r.ok ? '● verifies, showing ' + (r.revealed.length || 'none') + ' of ' + (r.revealed.length + r.withheld) + ' claims' : '✕ ' + esc(r.why)}</b>
          ${r.ok ? `<div class="tiny mut" style="margin-top:5px">They read: ${esc(r.revealed.join(', ') || 'nothing but the subject')}. Withheld: ${r.withheld}.</div>` : ''}</div>
          <pre class="keybox mono" style="margin-top:9px;max-height:22vh;overflow:auto;white-space:pre-wrap;font-size:10.5px">${esc(combined)}</pre>`;
        const b = m.q('#sdGo'); b.textContent = 'Save it';
        b.onclick = () => download('byline-selective.sd-jwt', combined, 'application/vc+sd-jwt');
      } catch (e) { toast('Could not build it: ' + e.message); }
    };
  };
  wire();
}

/* Delegating is a deliberate act: you pick exactly what it may do and for how
   long, and it is signed with your key, not stored as a preference. */
/* A delegation that runs out unannounced looks like a correspondent that
   stopped working. Say when it is close, and say plainly when it has gone. */
function expiryNote(validUntil) {
  const left = Math.ceil((Date.parse(validUntil) - now()) / 864e5);
  if (left < 0) return '<div class="tiny" style="color:var(--press);margin-top:4px">Expired — it has filed nothing since. Re-issue to put it back to work.</div>';
  if (left <= 7) return '<div class="tiny" style="color:var(--honey);margin-top:4px">Expires in ' + left + ' day' + (left === 1 ? '' : 's') + ' — after that it stops filing until you re-issue.</div>';
  return '';
}

function delegationEditor(a, done) {
  const held = a.delegation ? [].concat(a.delegation.credentialSubject.scope || []) : (POLICY_SCOPE[policyOf(a)] || []);
  const picked = new Set(held);
  let days = 30;
  const body = () => `
    <div class="tiny mut">You are about to sign a statement that <b>${esc(a.name)}</b> acts on your authority. It can prove this to anyone — and you can withdraw it without touching the correspondent.</div>
    <label class="f">What it may do</label>
    ${Object.keys(SCOPES).map(k => `<div class="rowbox" style="cursor:pointer;${picked.has(k) ? 'border-color:rgba(232,65,47,.4)' : ''}" data-sc="${k}">
      <div style="width:20px;text-align:center">${picked.has(k) ? '✓' : '·'}</div>
      <div class="sp"><b>${esc(k)}</b><div class="tiny mut">${esc(SCOPES[k])}</div></div></div>`).join('')}
    <label class="f">For how long</label>
    <select class="i" id="dDays">${[1, 7, 30, 90, 365].map(d => `<option value="${d}" ${d === days ? 'selected' : ''}>${d === 1 ? 'One day' : d === 365 ? 'A year' : d + ' days'}</option>`).join('')}</select>
    <div class="tiny dimt" style="margin-top:8px">Anything it passes on to another correspondent is a subset of this, expiring no later.</div>`;
  const m = modal(`Delegate to ${esc(a.name)}`, body(),
    `<span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="dGo">Sign it</button>`, true);
  const wire = () => {
    m.scrim.querySelectorAll('[data-sc]').forEach(n => n.onclick = () => {
      const k = n.dataset.sc; picked.has(k) ? picked.delete(k) : picked.add(k);
      days = +m.q('#dDays').value; m.q('.mc').innerHTML = body(); wire();
    });
    m.q('#dGo').onclick = async () => {
      const b = m.q('#dGo'); b.disabled = true; b.textContent = 'Signing…';
      try {
        const scope = Object.keys(SCOPES).filter(k => picked.has(k));
        const old = a.delegation && (a.delegation.credentialStatus || {}).statusListIndex;
        a.delegation = await issueVC(delegationCredential(me(), a, scope, +m.q('#dDays').value), me());
        if (old != null) slRevoke(old, 're-issued with a different scope');
        logEvent('delegation.issued', { to: a.name, by: me().name, scope, days: +m.q('#dDays').value }, S.meId);
        save(); m.close(); toast(`${a.name} now acts on your authority`, true); if (done) done();
      } catch (e) { b.disabled = false; b.textContent = 'Sign it'; toast('Could not sign: ' + e.message); }
    };
  };
  wire();
}

    <div id="polpick">${Object.keys(POLICIES).map(k => `<div class="rowbox" style="cursor:pointer;${pol === k ? 'border-color:rgba(232,65,47,.4)' : ''}" data-pol="${k}">
      <div style="font-size:15px;width:20px;text-align:center">${k === 'always_allow' ? '→' : k === 'always_ask' ? '✋' : '👁'}</div>

      <div id="delBox" class="tiny dimt">Checking…</div>`}`;

  const m = modal(isNew ? 'Hire a correspondent' : `${esc(a.name)} <span class="pill ag" style="margin-left:6px">${a.offline ? 'off the desk' : 'on the desk'}</span>`, body(),
    `${isNew ? '' : '<button class="btn danger" id="aDel">Let go</button><button class="btn" id="aRevoke">' + (a.revokedAt ? 'Reinstate key' : 'Revoke key') + '</button><button class="btn" id="aRestart">Restart</button>'}
     <span style="flex:1"></span><button class="btn" data-close>Cancel</button>
     <button class="btn primary" id="aGo">${isNew ? 'Hire' : 'Save'}</button>`, true);

  /* every picker in this dialog re-renders the body; keep the typed-in fields */
  const repaint = () => {
    const name = m.q('#aName').value, ins = m.q('#aIns').value;
    m.q('.mc').innerHTML = body();
    m.q('#aName').value = name; m.q('#aIns').value = ins;
    rewire();
  };
  const rewire = () => {
    m.scrim.querySelectorAll('#avPick button').forEach(b => b.onclick = () => {
      av = b.dataset.e; m.q('#avPrev').textContent = av;
      m.scrim.querySelectorAll('#avPick button').forEach(x => x.classList.toggle('on', x === b));
    });
    m.scrim.querySelectorAll('#hpick [data-h]').forEach(n => n.onclick = () => {
      harness = n.dataset.h; model = HARNESSES[harness].models[0];
      repaint();
      if (!isNew) { a.offline = true; toast('Harness changed — restart the agent to bring it online'); }
    });
    m.q('#aModel').onchange = e => model = e.target.value;
    m.scrim.querySelectorAll('#polpick [data-pol]').forEach(n => n.onclick = () => { pol = n.dataset.pol; repaint(); });
    m.scrim.querySelectorAll('#hostpick [data-host]').forEach(n => n.onclick = () => {
      if (n.dataset.host === 'gateway' && !S.settings.gateway.on) return toast('Connect a gateway in Settings first');
      host = n.dataset.host; repaint();
    });
    m.scrim.querySelectorAll('[data-mrm]').forEach(b => b.onclick = () => {
      a.memories.splice(+b.dataset.mrm, 1); save(); repaint();
    });
    if (!isNew) paintDelegation();
  };

  /* The four questions KYA-OS asks of any agent, answered from the credential
     it actually holds rather than from a field on a card. */
  async function paintDelegation() {
    const box = m.q('#delBox'); if (!box) return;
    const d = a.delegation;
    const eff = await effectiveScope(a);
    const rows = s => s.length
      ? s.map(x => `<div>· ${esc(SCOPES[x] || x)}</div>`).join('')
      : '<div class="mut">Nothing at all.</div>';
    if (!d) {
      box.innerHTML = `<div class="rowbox" style="display:block;padding:10px">
        <div class="mut">No delegation on file. It falls back to the permission set above — which is a setting, not something it can prove to anyone outside this masthead.</div>
        <div style="margin-top:8px">${rows(eff.scope)}</div></div>
        <button class="btn sm" id="delGo" style="margin-top:8px">Delegate authority to it</button>`;
    } else {
      const v = await verifyDelegation(d);
      const idx = (d.credentialStatus || {}).statusListIndex;
      box.innerHTML = `<div class="rowbox" style="display:block;padding:10px;border-color:${v.ok ? 'rgba(90,168,119,.4)' : 'rgba(232,65,47,.5)'}">
        <div><b>Who is it</b> — <span class="mono">${esc((a.did || '').slice(0, 30))}…</span></div>
        <div style="margin-top:5px"><b>Who authorised it</b> — ${esc(d.credentialSubject.authorisedByName)}${v.ok && v.via ? `, passed on by ${esc(v.via)}` : ''}${v.ok && v.root && v.root !== d.credentialSubject.authorisedByName ? ` (rooted in ${esc(v.root)})` : ''}</div>
        <div style="margin-top:5px"><b>What may it do</b></div>${rows([].concat(d.credentialSubject.scope || []))}
        <div style="margin-top:5px"><b>How far does it reach</b> — until ${esc(new Date(d.validUntil).toLocaleDateString())}, ${v.ok ? v.depth + ' link' + (v.depth === 1 ? '' : 's') + ' from you' : 'chain unverified'}</div>
        ${expiryNote(d.validUntil)}
        <div style="margin-top:8px;color:${v.ok ? 'var(--good)' : 'var(--press)'}">${v.ok ? '● the chain of authority holds' : '✕ ' + esc(v.why)}</div></div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="btn sm" id="delGo">Re-issue</button>
          <button class="btn sm" id="delShow">Show the credential</button>
          <button class="btn sm" id="delBuzz">As a Buzz auth tag</button>
          ${idx != null ? `<button class="btn sm ${slRevoked(idx) ? '' : 'danger'}" id="delRev">${slRevoked(idx) ? 'Reinstate' : 'Withdraw'}</button>` : ''}
        </div>`;
      const sh = m.q('#delShow'); if (sh) sh.onclick = () => vcModal(d, a.name + '’s delegation');
      const bz = m.q('#delBuzz');
      if (bz) bz.onclick = async () => {
        try {
          const x = await nipoaFromDelegation(a);
          const tagText = JSON.stringify(x.tag);
          const mm = modal('As a Buzz auth tag', `
            <div class="tiny mut" style="margin:6px 0 10px">A NIP-OA owner attestation: your Nostr key — derived from your byline key — says ${esc(a.name)}’s Nostr key may post channel messages until ${esc(new Date(d.validUntil).toLocaleDateString())}. Buzz reads it; any Nostr verifier can check it.</div>
            <div class="tiny dimt">The tag</div><div class="keybox" style="margin-top:4px;font-size:11px">${esc(tagText)}</div>
            <div class="tiny dimt" style="margin-top:10px">${esc(a.name)}’s Nostr key</div><div class="keybox" style="margin-top:4px;font-size:11px">${esc(x.agentPub)}</div>
            <div class="tiny" style="margin-top:10px;color:var(--honey)">What NIP-OA cannot carry: the named scopes (${esc(x.lost.join(', ') || 'none')}), passing authority on, and withdrawal. Buzz enforces scopes on its relay rather than in the credential, and ends an agent by ending its owner’s membership.</div>`,
            `<button class="btn" data-close>Close</button><button class="btn primary" id="bzCopy">Copy the tag</button>`);
          mm.q('#bzCopy').onclick = () => { try { navigator.clipboard.writeText(tagText); toast('Tag copied', true); } catch (e) { toast('Copy it from the box'); } };
          logEvent('delegation.exported', { agent: a.name, to: 'nip-oa', conditions: x.conditions }, S.meId);
        } catch (e) { toast(e.message); }
      };
      const rv = m.q('#delRev');
      if (rv) rv.onclick = () => {
        slRevoked(idx) ? slRestore(idx) : slRevoke(idx, 'withdrawn by ' + me().name);
        logEvent(slRevoked(idx) ? 'delegation.revoked' : 'delegation.restored', { agent: a.name, index: idx }, S.meId);
        toast(slRevoked(idx) ? 'Withdrawn — it can no longer file' : 'Reinstated'); paintDelegation();
      };
    }
    const go = m.q('#delGo'); if (go) go.onclick = () => delegationEditor(a, paintDelegation);
  }
  rewire();

  m.q('#aGo').onclick = async () => {
    const name = m.q('#aName').value.trim();
    if (!name) return toast('Name it');
    const ins = m.q('#aIns').value;
    if (isNew) {
      const go = m.q('#aGo'); go.textContent = 'Cutting a key…'; go.disabled = true;
      const handle = name.toLowerCase().replace(/[^a-z0-9]/g, '') || 'agent';
      const kp = Object.assign(keypair(handle + now()), (await genIdentity()) || {});
      const na = Object.assign({
        id: uid('p'), type: 'agent', name, handle, avatar: av, color: pick(AV_COLORS),
        instructions: ins, harness, model, host, policy: pol, memories: [], presence: 'online'
      }, kp);
      S.people[na.id] = na;
      logEvent('agent.created', { name, harness }, S.meId);
      save(); m.close(); render();
      modal('Correspondent hired', `<div style="display:flex;gap:12px;align-items:center;margin-top:8px">
        ${avatar(na, 'xl')}<div><b style="font-size:16px">${esc(name)}</b>
        <div class="tiny mut">${esc(HARNESSES[harness].icon)} ${esc(HARNESSES[harness].name)} · ${esc(model)}</div></div></div>
        <div class="tiny mut" style="margin-top:14px">Byline cut it ${na.alg ? 'a real <b>ECDSA P-256</b> keypair' : 'a keypair'} — not an API token. This is the byline it files under:</div>
        <div class="keybox" style="margin-top:8px">${esc(npub(na.pub))}</div>
        <div class="tiny dimt" style="margin-top:10px">Now put it on a desk and @mention it.</div>`,
        `<button class="btn" data-close>Later</button><button class="btn primary" id="addNow">Put it on a desk</button>`);
      const b = $('#modals').lastChild.querySelector('#addNow');
      b.onclick = () => { b.closest('.scrim').remove(); if (UI.view !== 'channel') { UI.view = 'channel'; render(); } addPeopleModal(); };
    } else {
      Object.assign(agent, { name, instructions: ins, harness, model, host, policy: pol, avatar: av });
      logEvent('agent.updated', { name, harness, host, policy: pol });
      save(); m.close(); render(); toast('Saved', true);
    }
  };
  if (!isNew) {
    const vcb = m.q('#aVC');
    if (vcb) vcb.onclick = async () => {
      try {
        const vc = await issueVC(correspondentCredential(agent), me());
        download(`byline-correspondent-${agent.handle}.jsonld`, JSON.stringify(vc, null, 2), 'application/ld+json');
        logEvent('credential.issued', { kind: 'correspondent', who: agent.name }); save();
        toast('Credential issued for ' + agent.name, true);
      } catch (e) { toast('Could not issue: ' + e.message); }
    };
    m.q('#aRevoke').onclick = () => {
      const on = !agent.revokedAt;
      if (on && !confirm(`Revoke ${a.name}'s key? Anything it files from now on will fail verification. Copy already filed stays valid.`)) return;
      revoke(agent, on); m.close(); render();
      toast(on ? a.name + `'s key revoked` : a.name + `'s key reinstated`, !on);
    };
    m.q('#aRestart').onclick = async () => {
      const b = m.q('#aRestart'); b.textContent = 'Restarting…'; b.disabled = true;
      Object.assign(agent, { harness, model });
      await sleep(900);
      agent.offline = false; save(); render();
      b.textContent = 'Restart'; b.disabled = false;
      toast(`${agent.name} back on the desk via ${HARNESSES[harness].name}`, true);
    };
    m.q('#aDel').onclick = () => {
      if (!confirm('Let ' + a.name + ' go? Everything it filed stays, byline intact.')) return;
      delete S.people[a.id];
      S.channels.forEach(c => c.members = c.members.filter(x => x !== a.id));
      logEvent('agent.deleted', { name: a.name }); save(); m.close(); render();
    };
  }
  setTimeout(() => { const n = m.q('#aName'); if (n) n.focus(); }, 40);
}

/* ==========================================================================
   SMOKE TESTS — open with ?test=1
   Every case here is a bug that actually shipped and was caught by hand.
   Runs against a scratch workspace and restores yours afterwards.
   ========================================================================== */
let TESTING = false;
async function runTests() {
  TESTING = true;
  /* The suite gets its own storage key. It used to share the live one: it
     parked the real masthead, ran, and restored it — and any app tab open at
     the same time kept writing to the shared key, which the merge-on-save then
     folded into the test seed. Now the two never meet. */
  KEY = 'byline.workspace.v2:test';
  try { localStorage.removeItem(LEGACY.key + ':test'); } catch (e) { }
  const R = [];
  const ok = (v, m) => { if (!v) throw new Error(m || 'expected truthy'); };
  const eq = (a, b, m) => { if (a !== b) throw new Error(`${m || ''} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
  /* ?only=Group[,Group] runs one slice of the suite. It exists so that
     mutation testing — breaking the product on purpose to prove a test can
     see it — costs a couple of seconds per mutant instead of a minute. */
  const ONLY = (new URLSearchParams(location.search).get('only') || '')
    .split(',').map(s => s.trim()).filter(Boolean);
  const t = async (group, name, fn) => {
    if (ONLY.length && ONLY.indexOf(group) < 0) return;
    RUNNING = group + ' / ' + name;
    const t0 = performance.now();
    try { const d = await fn(); R.push({ group, name, ok: true, detail: d || '', ms: Math.round(performance.now() - t0) }); }
    catch (e) { R.push({ group, name, ok: false, detail: String(e.message || e), ms: Math.round(performance.now() - t0) }); }
    paintTests(R, true);
  };
  const sleep2 = ms => new Promise(r => setTimeout(r, ms));
  /* A run that hangs reports nothing, and nothing looks exactly like a
     browser that never started. Twice a deliberately broken build hung the
     headless run instead of failing it, and the only way to see what had
     happened was to open a window and look. The watchdog posts whatever the
     run has, names the test it was inside, and says the run is incomplete —
     a partial answer beats silence. */
  let RUNNING = null;
  const watchdog = setTimeout(() => {
    const to = new URLSearchParams(location.search).get('report');
    if (!to || !reportAllowed(to)) return;
    try {
      navigator.sendBeacon(to, new Blob([JSON.stringify({
        ua: navigator.userAgent, when: new Date().toISOString(),
        pass: R.filter(r => r.ok).length, fail: R.filter(r => !r.ok).length,
        incomplete: true, stuckIn: RUNNING,
        failures: R.filter(r => !r.ok).map(r => ({ group: r.group, name: r.name, detail: r.detail })),
      })], { type: 'application/json' }));
    } catch (e) { }
  }, 150e3);
  /* a stand-in Response: whatever the code under test reads, it is there */
  const resp = (status, body) => {
    const text = typeof body === 'string' ? body : JSON.stringify(body);
    return { ok: status >= 200 && status < 300, status, text: async () => text,
      json: async () => JSON.parse(text), body: null };
  };

  /* The real masthead is PARKED under its own key, not merely held in a
     variable. A run that dies — a closed tab, a crash, a mutant that never
     finishes — used to leave the test seed in storage and the person's actual
     workspace nowhere. boot() restores the parked copy if it ever finds one. */
  const snapshot = localStorage.getItem(KEY);
  if (snapshot) localStorage.setItem(KEY + ':parked', snapshot);
  localStorage.removeItem(KEY);
  S = null;
  const built = await seed({ name: 'Test Runner', avatar: '🧪', harness: 'claude-code', community: 'Test Masthead' });
  OWNER = S.meId;
  const desk = S.channels[0], meP = me();
  const scout = Object.values(S.people).find(p => p.name === 'Scout');
  const nib = Object.values(S.people).find(p => p.name === 'Nib');

  /* ---- bylines ---- */
  await t('Bylines', 'real ECDSA keypair minted for every identity', () => {
    const all = Object.values(S.people);
    eq(all.filter(p => p.alg === 'ecdsa-p256').length, all.length, 'identities with real keys:');
    ok(meP.jwk && meP.jwk.d, 'private key present');
  });
  await t('Bylines', 'signature verifies, and tampering breaks it', async () => {
    const m = postMessage({ channelId: desk.id, authorId: meP.id, text: 'byline test' });
    await sleep2(120);
    eq(await verifyReal(m), true, 'fresh signature:');
    const keep = m.text; m.text = 'tampered';
    eq(await verifyReal(m), false, 'after tampering:');
    m.text = keep;
    eq(await verifyReal(m), true, 'after restoring:');
    return m.sig.length + '-char signature';
  });
  await t('Bylines', 'renaming an attachment invalidates the signature', async () => {
    const m = postMessage({ channelId: desk.id, authorId: meP.id, text: 'with a file', att: [{ name: 'a.csv', size: 10, type: 'text/csv' }] });
    await sleep2(120);
    eq(await verifyReal(m), true, 'signed with attachment:');
    m.att[0].name = 'evil.csv';
    eq(await verifyReal(m), false, 'after rename:');
  });
  await t('Bylines', 'legacy digest bylines still verify', () => {
    const eng = S.channels.find(c => c.name === 'engineering');
    const old = (S.messages[eng.id] || [])[0];
    ok(old && !old.alg, 'seeded message uses the legacy path');
    eq(bylineState(old), 'ok', 'legacy verify:');
    const keep = old.text; old.text = 'x';
    eq(bylineState(old), 'bad', 'legacy tamper:');
    old.text = keep;
  });

  /* ---- wire / workflows ---- */
  await t('The wire', 'YAML parses nested maps, lists and scalars', () => {
    const d = parseYAML(`name: T\non:\n  event: message.created\n  channel: social-media\nif:\n  author_is_agent: true\nsteps:\n  - post:\n      text: "hi"\n  - webhook:\n      url: https://x/y`);
    eq(d.name, 'T'); eq(d.on.event, 'message.created'); eq(d.if.author_is_agent, true);
    eq(d.steps.length, 2); eq(d.steps[0].post.text, 'hi'); eq(d.steps[1].webhook.url, 'https://x/y');
  });
  await t('The wire', 'fires on an agent draft, gated on the byline', async () => {
    S.settings.experiments.workflows = true;
    const soc = S.channels.find(c => c.name === 'social-media');
    if (!soc.members.includes(nib.id)) soc.members.push(nib.id);
    const n0 = S.webhooks.length;
    const m = postMessage({ channelId: soc.id, authorId: nib.id, text: 'a draft' });
    runWorkflows('message.created', { message: m, actor: nib, channel: soc });
    await sleep2(500);
    ok(S.webhooks.length > n0, 'webhook fired for a correspondent');
    const n1 = S.webhooks.length;
    const mine = postMessage({ channelId: soc.id, authorId: meP.id, text: 'my own line' });
    runWorkflows('message.created', { message: mine, actor: meP, channel: soc });
    await sleep2(400);
    eq(S.webhooks.length, n1, 'must not fire for a human byline:');
  });
  await t('The wire', 'with a relay set, a webhook goes out through it and the answer is kept', async () => {
    const realFetch = window.fetch, wasRelay = S.workspace.relay, wasTok = S.workspace.relayToken, asked = [];
    /* the relay's own answer is small and read with json(); only the two
       fetches that go to an address somebody else chose are bounded */
    let answer = { ok: true, status: 200, json: async () => ({ ok: true, status: 204, body: '' }) };
    window.fetch = async (u, o) => { asked.push({ u: String(u), o }); return answer; };
    try {
      S.workspace.relay = 'http://relay.test'; S.workspace.relayToken = 'sesame';
      S.settings.experiments.workflows = true;
      const soc = S.channels.find(c => c.name === 'social-media');
      if (!soc.members.includes(nib.id)) soc.members.push(nib.id);
      const n0 = S.webhooks.length;
      runWorkflows('message.created', { message: postMessage({ channelId: soc.id, authorId: nib.id, text: 'a draft for the wire' }), actor: nib, channel: soc });
      let until = Date.now() + 3000; while (Date.now() < until && S.webhooks.length === n0) await sleep2(50);
      ok(S.webhooks.length > n0, 'a delivery was recorded');
      const h = S.webhooks[0];
      eq(h.via, 'relay', 'through the relay:');
      const call = asked.find(a => /\/deliver$/.test(a.u));
      ok(call, 'the relay was asked to deliver');
      ok(call && call.o.headers.authorization === 'Bearer sesame', 'with the token');
      const job = call && JSON.parse(call.o.body);
      ok(job && job.url === h.url && JSON.stringify(job.body) === JSON.stringify(h.body), 'carrying the endpoint and the payload');
      eq(h.status, 204, 'and the endpoint\'s own answer is what is kept:');
      answer = { ok: false, status: 403, json: async () => ({ error: 'this relay does not deliver to hooks.example' }) };
      const n1 = S.webhooks.length;
      runWorkflows('message.created', { message: postMessage({ channelId: soc.id, authorId: nib.id, text: 'another draft' }), actor: nib, channel: soc });
      until = Date.now() + 3000; while (Date.now() < until && S.webhooks.length === n1) await sleep2(50);
      eq(S.webhooks[0].status, 403, 'a refusal by the relay is recorded as such:');
      ok(/does not deliver/.test(S.webhooks[0].note || ''), 'with its reason');
    } finally { window.fetch = realFetch; S.workspace.relay = wasRelay; S.workspace.relayToken = wasTok; }
  });
  await t('The wire', 'thumbs-up publishes, and only the owner can', async () => {
    const soc = S.channels.find(c => c.name === 'social-media');
    const draft = (S.messages[soc.id] || []).filter(m => m.authorId === nib.id).slice(-1)[0];
    const n0 = S.webhooks.length;
    runWorkflows('reaction.added', { message: draft, actor: S.people[scout.id], emoji: '👍', channel: soc });
    await sleep2(300);
    eq(S.webhooks.length, n0, 'a non-owner reaction must not publish:');
    runWorkflows('reaction.added', { message: draft, actor: meP, emoji: '👍', channel: soc });
    await sleep2(500);
    ok(S.webhooks.length > n0, 'owner reaction publishes');
    eq(S.webhooks[0].body.approved_by, meP.pub, 'payload carries the approver pubkey:');
  });

  /* ---- search ---- */
  await t('Search', 'terms, from:, in: and has:file all filter', () => {
    postMessage({ channelId: desk.id, authorId: scout.id, text: 'a distinctive haystack phrase' });
    postMessage({ channelId: desk.id, authorId: meP.id, text: 'carrying a document', att: [{ name: 'r.pdf', size: 5, type: 'application/pdf' }] });

    eq(runSearch('haystack from:' + meP.handle).length, 0, 'from: excludes:');
    ok(runSearch('has:file').length >= 1, 'has:file');
    ok(runSearch('haystack in:' + desk.name).length >= 1, 'in: filter');
    eq(runSearch('haystack in:engineering').length, 0, 'in: excludes:');

  /* ---- threads ---- */
  await t('Threads', 'replies mark unread, opening the thread clears it', () => {

  await t('Gateway', 'waking drains the queue', async () => {

  /* ---- regressions that shipped ---- */
  await t('Regressions', 'busy is never persisted (wedged correspondents)', () => {
    scout.busy = true; save();
    const stored = JSON.parse(localStorage.getItem(KEY));
    // boot clears it; assert the clearing logic itself

  await t('Regressions', 'no CSS width uses min() (collapsed to 1px)', () => {

      const before = (S.messages[desk.id] || []).filter(m => m.authorId === nib.id).length;

    } finally { window.fetch = realFetch; S.settings.live.on = false; }

/* Flatten every CSS rule, descending into @media / @supports only.
   Don't duck-type on `.cssRules`: modern engines expose it on plain style
   rules too (CSS nesting), so `if (r.cssRules)` walks straight past the
   rules you actually want and silently returns almost nothing. */
function allCssRules() {
  const GROUPING = { 4: 1, 12: 1 };            // CSSMediaRule, CSSSupportsRule
  const out = [];
  const walk = rules => {
    for (let i = 0; i < rules.length; i++) {
      const r = rules[i];
      if (GROUPING[r.type] && r.cssRules) walk(r.cssRules);
      else if (r.type === 1) out.push(r);       // CSSStyleRule
    }
  };
  for (const sh of document.styleSheets) { try { walk(sh.cssRules); } catch (e) { } }
  return out;
}

    const desks = S.channels.filter(c => c.kind !== 'dm');
    const at = desks.findIndex(c => c.id === UI.channelId);
    switch (e.key) {
      case '/': e.preventDefault(); { const b = $('#sq'); if (b) b.focus(); } break;
      case 'j': if (at > -1 && at < desks.length - 1) openChannel(desks[at + 1].id); break;
      case 'k': if (at > 0) openChannel(desks[at - 1].id); break;
      case 'c': e.preventDefault(); { const b = $('#ta'); if (b) b.focus(); } break;
      case 'g': UI.view = 'channel'; UI.tab = 'galley'; UI.tab = 'canvas'; render(); break;
      case 'r': UI.view = 'audit'; render(); break;
      case 'a': UI.view = 'agents'; render(); break;
      case ',': UI.view = 'settings'; render(); break;
      case '?': shortcutsModal(); break;
    }
  });

}
